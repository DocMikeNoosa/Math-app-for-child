    <radialGradient id="halo" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#62a9ff" stop-opacity=".42"/><stop offset=".6" stop-color="#62a9ff" stop-opacity=".08"/><stop offset="1" stop-color="#62a9ff" stop-opacity="0"/></radialGradient>
