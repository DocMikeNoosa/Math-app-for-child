<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EndoLetter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 4c3 0 5 2 8 2s5-2 8-2c4 0 5 4 4 9-1 4-2 6-3 11-1 4-3 5-4 1l-2-7c-1-2-3-2-4 0l-2 7c-1 4-3 3-4-1-1-5-2-7-3-11C3 8 4 4 8 4z' fill='%231F6F8B'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F8FAFB; --ink:#16212B; --ink-2:#4A5764; --muted:#7A8794;
  --line:#DCE2E8; --line-2:#EBEFF3; --accent:#1F6F8B; --accent-ink:#FFFFFF; --accent-soft:#E3F0F5; --accent-2:#155369;
  --warn:#9A5B00; --warn-bg:#FFF5E1; --danger:#B42318; --danger-bg:#FDECEA; --ok:#1D7A4E; --ok-bg:#E5F5EC;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--accent)}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;color:var(--accent-2)}
.brand svg{width:24px;height:24px}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:550}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent-2)}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:#D98E04}.dot.busy{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* banners */
.banner{display:flex;align-items:center;gap:12px;padding:10px 20px;font-size:13.5px;border-bottom:1px solid var(--line)}
.banner.warn{background:var(--warn-bg);color:#5C3A00}
.banner.info{background:var(--accent-soft);color:var(--accent-2)}
.banner .grow{flex:1}
main{max-width:1440px;margin:0 auto;padding:20px}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card>header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.card>header h3{font-size:14.5px}
.card>header .sub{color:var(--muted);font-size:12.5px}
.card .body{padding:14px 16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:550;min-width:0}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13.5px;color:var(--ink);font-weight:400}
textarea{resize:vertical;min-height:60px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:550;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);border-color:#BDE5CE;color:var(--ok)}
.pill.acc{background:var(--accent-soft);border-color:#BFDCE7;color:var(--accent-2)}
.pill.warn{background:var(--warn-bg);border-color:#F2D9A6;color:var(--warn)}
/* segmented */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--line-2);color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on.bad{background:#B54708}
.test{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.test:last-child{border-bottom:0}
.test>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12.5px;cursor:pointer;background:var(--surface);user-select:none}
.chk input{margin:0;accent-color:var(--accent)}
.chk:has(input:checked){background:var(--accent-soft);border-color:#9CC8D8;color:var(--accent-2)}
/* layout */
.editor{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr);gap:16px;align-items:start}
.side{position:sticky;top:72px;max-height:calc(100vh - 88px);display:flex;flex-direction:column}
.side .card{display:flex;flex-direction:column;min-height:0;margin-bottom:0}
.side .card .body{overflow:auto}
@media (max-width:1100px){.editor{grid-template-columns:1fr}.side{position:static;max-height:none}}
@media (max-width:700px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.test{grid-template-columns:1fr}.nav button{padding:8px 7px}.status span.txt{display:none}main{padding:12px}}
.casehead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.casehead h2{font-size:20px}
/* odontogram */
.odo{width:100%;max-width:760px;display:block;margin:0 auto}
.odo g.t{cursor:pointer}
.odo g.t:hover path.cr{stroke:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:92px;text-align:left}
.tab b{font-size:13.5px}
.tab small{color:var(--muted);font-size:11px}
.tab.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.section-t{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:16px 0 8px}
.section-t:first-child{margin-top:0}
.dxbox{border:1px solid #BFDCE7;background:var(--accent-soft);border-radius:9px;padding:11px 13px}
.dxbox .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);font-weight:700}
.dxbox .val{font-size:15px;font-weight:650;margin:2px 0 4px}
.dxbox ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.warnline{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:5px 8px;margin-top:6px}
table.canals{width:100%;border-collapse:collapse;font-size:13px}
table.canals th{font-size:11.5px;text-align:left;color:var(--muted);font-weight:600;padding:4px 6px}
table.canals td{padding:3px 4px}
table.canals input{padding:5px 7px}
/* side outputs */
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--line-2);padding:0 10px}
.stabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.stabs button.on{color:var(--accent-2);border-bottom-color:var(--accent)}
pre.note{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:12px;margin:0}
textarea.letter{min-height:380px;font-size:13.5px;line-height:1.55}
.glance{border:1px solid #BFDCE7;background:#F4FAFC;border-radius:9px;padding:10px 12px;margin-bottom:12px}
.glance .gt{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--accent-2);margin-bottom:6px}
.glance .gl{font-size:12.5px;margin-top:6px}
.glance .gl b{color:var(--accent-2)}
/* records */
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:56px}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:#F7FAFC}
.empty{padding:40px;text-align:center;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:12px}
.thumb{width:200px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:140px;object-fit:contain;background:#111;display:block}
.thumb .tb{padding:7px;display:flex;flex-direction:column;gap:6px}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent-2)}
.logo-prev{max-height:60px;max-width:220px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal.wide{width:min(1000px,100%);height:92vh}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.modal header h3{font-size:15.5px;flex:1}
.modal .mb{padding:16px 18px;overflow:auto;flex:1}
.modal footer{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal iframe{width:100%;height:100%;border:0;border-radius:6px;background:#525659}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center}
.toast{background:#1B2733;color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.toast.err{background:var(--danger)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
code.path{font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);padding:1px 6px;border-radius:5px;word-break:break-all}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><svg viewBox="0 0 32 32"><path d="M8 4c3 0 5 2 8 2s5-2 8-2c4 0 5 4 4 9-1 4-2 6-3 11-1 4-3 5-4 1l-2-7c-1-2-3-2-4 0l-2 7c-1 4-3 3-4-1-1-5-2-7-3-11C3 8 4 4 8 4z" fill="#1F6F8B"/></svg>EndoLetter</div>
  <nav class="nav" id="nav">
    <button data-nav="case">Case</button>
    <button data-nav="records">Records</button>
    <button data-nav="referrers">Referring dentists</button>
    <button data-nav="settings">Settings</button>
  </nav>
  <div class="status" id="status"></div>
</div>
<div id="banner"></div>
<main id="view"></main>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>/*__JSPDF__*/</script>
<script>
'use strict';
/* ============================================================
   EndoLetter — endodontic diagnosis, chart note & referral letter
   All data stays on this computer (IndexedDB + optional folder).
   ============================================================ */

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtLong(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return `${MONTHS[m-1]} ${d}, ${y}`; }
function fmtShort(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${m}/${d}/${y}`; }
function fmtTime(ts){ return new Date(ts).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); }
function debounce(fn, ms){ let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; f.flush = (...a) => { clearTimeout(t); return fn(...a); }; return f; }
function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v){ const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (a[k] ??= {}), o); t[last] = v; }
function listJoin(a){ a = a.filter(Boolean); if(a.length < 2) return a.join(''); if(a.length === 2) return a.join(' and '); return a.slice(0, -1).join(', ') + ', and ' + a[a.length - 1]; }
function cap(s){ return s ? s[0].toUpperCase() + s.slice(1) : s; }
function numWord(n){ return ['zero','one','two','three','four','five','six','seven','eight','nine','ten'][n] ?? String(n); }
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3200); }

/* ---------------- IndexedDB ---------------- */
const DB = {
  db: null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open('endoletter', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('cases', {keyPath:'id'}); d.createObjectStore('referrers', {keyPath:'id'}); d.createObjectStore('kv'); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error);
  }); },
  tx(store, mode, fn){ return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out && 'result' in out ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  all(store){ return this.tx(store, 'readonly', s => s.getAll()); },
  put(store, v, k){ return this.tx(store, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)); },
  del(store, k){ return this.tx(store, 'readwrite', s => s.delete(k)); },
  get(store, k){ return this.tx(store, 'readonly', s => s.get(k)); },
};

/* ---------------- domain: teeth ---------------- */
const POS_NAMES = ['', 'central incisor', 'lateral incisor', 'canine', 'first premolar', 'second premolar', 'first molar', 'second molar', 'third molar'];
function toothInfo(n){
  let arch, side, pos;
  if(n <= 8){ arch = 'U'; side = 'right'; pos = 9 - n; }
  else if(n <= 16){ arch = 'U'; side = 'left'; pos = n - 8; }
  else if(n <= 24){ arch = 'L'; side = 'left'; pos = 25 - n; }
  else { arch = 'L'; side = 'right'; pos = n - 24; }
  const type = pos <= 2 ? 'incisor' : pos === 3 ? 'canine' : pos <= 5 ? 'premolar' : 'molar';
  const fdiQ = arch === 'U' ? (side === 'right' ? 1 : 2) : (side === 'left' ? 3 : 4);
  return { n, arch, side, pos, type, fdi: fdiQ * 10 + pos, name: `${arch === 'U' ? 'maxillary' : 'mandibular'} ${side} ${POS_NAMES[pos]}` };
}
function tLabel(n){ return S.settings.numbering === 'FDI' ? String(toothInfo(n).fdi) : String(n); }
function tRef(n){ return '#' + tLabel(n); }
function canalPresets(n){
  const t = toothInfo(n);
  if(t.arch === 'U'){
    if(t.type === 'molar') return { def:['MB','DB','P'], extra:['MB2','MB3','DB2','P2'] };
    if(t.pos === 4) return { def:['B','P'], extra:['MB','DB','Single'] };
    if(t.pos === 5) return { def:['Single'], extra:['B','P'] };
    return { def:['Single'], extra:['Second canal'] };
  }
  if(t.type === 'molar') return { def:['MB','ML','D'], extra:['DL','MM','DB','Single (C-shaped)'] };
  if(t.type === 'premolar') return { def:['Single'], extra:['B','L'] };
  return { def:['Single'], extra:['B','L'] };
}

/* ---------------- domain: options ---------------- */
const PROCS = {
  NSRCT:     { short:'NSRCT', long:'Nonsurgical root canal therapy', canals:true, obt:true },
  NSRETX:    { short:'NS Retx', long:'Nonsurgical endodontic retreatment', canals:true, obt:true },
  APICO:     { short:'Apico', long:'Apicoectomy (endodontic microsurgery)', material:'Root-end filling material', nodam:true },
  PULPECTOMY:{ short:'Pulpectomy', long:'Pulpectomy (emergency pulpal debridement)', canals:true },
  PULPOTOMY: { short:'Pulpotomy', long:'Pulpotomy', material:'Pulpotomy material' },
  VPT:       { short:'VPT', long:'Vital pulp therapy (pulp capping)', material:'Capping material' },
  IND:       { short:'I&D', long:'Incision and drainage', notemp:true, nodam:true },
  APEXIF:    { short:'Apexification', long:'Apexification', canals:true, material:'Apical barrier material' },
  REP:       { short:'REP', long:'Regenerative endodontic procedure', canals:true, material:'Coronal barrier material' },
  EVAL:      { short:'Eval', long:'Evaluation / consultation', eval:true, notemp:true },
};
const STATUS = { completed:'Completed', initiated:'Initiated - to be completed', recommended:'Recommended' };
const STATUS_SHORT = { completed:'Completed', initiated:'Initiated', recommended:'Recommended' };
const REC_PROC = { NSRCT:'Nonsurgical root canal therapy', NSRETX:'Nonsurgical retreatment', APICO:'Apicoectomy (endodontic microsurgery)', VPT:'Vital pulp therapy', EXT:'Extraction (tooth non-restorable / poor prognosis)', MONITOR:'No endodontic treatment needed at this time - monitor', OTHER:'Other (see notes)' };
const PULP_DX = { NP:'Normal pulp', RP:'Reversible pulpitis', SIP:'Symptomatic irreversible pulpitis', AIP:'Asymptomatic irreversible pulpitis', PN:'Pulp necrosis', PT:'Previously treated', PIT:'Previously initiated therapy' };
const PERI_DX = { NAT:'Normal apical tissues', SAP:'Symptomatic apical periodontitis', AAP:'Asymptomatic apical periodontitis', AAA:'Acute apical abscess', CAA:'Chronic apical abscess', CO:'Condensing osteitis' };
const RADIO = { normal:'Normal PDL space and lamina dura', widepdl:'Widened PDL space', parl:'Periapical radiolucency', opacity:'Diffuse periapical radiopacity', caries:'Deep caries', deeprest:'Deep restoration', rcf:'Existing root canal filling', shortobt:'Inadequate existing obturation', post:'Existing post', calc:'Calcified canal(s)', intres:'Internal resorption', extres:'External resorption', openapex:'Open apex', boneloss:'Periradicular / furcal bone loss' };
const IRRIG = { naocl:'Sodium hypochlorite (NaOCl)', edta:'17% EDTA', chx:'2% chlorhexidine', saline:'Sterile saline', us:'Ultrasonic activation', sonic:'Sonic activation', negp:'Negative-pressure irrigation' };
const OBTUR = { '':'—', wv:'Warm vertical condensation', cw:'Continuous wave of condensation', sc:'Single cone with bioceramic sealer', cl:'Cold lateral condensation', cb:'Carrier-based obturation', wl:'Warm lateral condensation' };
const MEDIC = { '':'None', caoh:'Calcium hydroxide', tap:'Triple antibiotic paste', dap:'Double antibiotic paste', other:'Other (see notes)' };
const TEMP = { '':'—', cavit:'Cavit', irm:'IRM', gic:'Glass ionomer', cavitgic:'Cavit and glass ionomer', comp:'Composite core build-up', cavitcomp:'Cavit and composite' };
const FINDINGS = { mb2:'MB2 canal located and treated', extra:'Additional canal located', calc:'Calcified canal(s)', curve:'Severely curved canal(s)', crack:'Craze / crack line noted', vrf:'Vertical root fracture suspected', sep:'Separated instrument', sepbp:'Separated instrument bypassed', sepret:'Separated instrument removed', perf:'Perforation repaired', resorp:'Resorption managed', openapex:'Open apex', prevrem:'Previous root filling removed', postrem:'Post removed', ledge:'Ledge / blockage', pus:'Purulent drainage on access', bleed:'Hemorrhage from canals', notneg:'Unable to fully negotiate canal(s)' };
const PROG = { favorable:'Favorable', questionable:'Questionable', unfavorable:'Unfavorable', '':'—' };
const TEMP_PHRASE = { cavit:'Cavit', irm:'IRM', gic:'glass ionomer', cavitgic:'Cavit and glass ionomer', comp:'a composite core build-up', cavitcomp:'Cavit and composite' };
const RESTOR = { crown:'Full-coverage crown', onlay:'Cuspal-coverage onlay', postcore:'Post / core build-up and crown', direct:'Bonded direct restoration', access:'Permanent restoration of access (existing crown)', pending:'Defer until endodontic treatment is completed', none:'None at this time' };
const RTIME = { '2w':'within 2 weeks', '30d':'within 30 days', '60d':'within 60 days', asap:'as soon as possible', '':'' };
const RECALL = { '':'None', '3m':'3 months', '6m':'6 months', '12m':'12 months', '6-12m':'6 and 12 months', '24m':'24 months' };
const RECALL_SHORT = { '3m':'3 mo', '6m':'6 mo', '12m':'12 mo', '6-12m':'6 & 12 mo', '24m':'24 mo' };

const T_COLD = { nt:'Not tested', wnl:'WNL', exag:'Exaggerated, non-lingering', lingering:'Lingering', nr:'No response' };
const T_HEAT = { nt:'Not tested', wnl:'WNL', lingering:'Lingering', nr:'No response' };
const T_EPT = { nt:'Not tested', resp:'Responsive', nr:'No response' };
const T_TEND = { nt:'Not tested', wnl:'Not tender', tender:'Tender' };
const T_BITE = { nt:'Not tested', wnl:'No pain', pain:'Pain on biting', release:'Pain on release' };
const T_SWELL = { none:'None', local:'Localized intraoral', diffuse:'Diffuse / facial' };
const T_SINUS = { no:'None', yes:'Present' };
const T_MOB = { '':'NT', '0':'0 (physiologic)', '1':'1', '2':'2', '3':'3' };

function newTooth(n){
  return {
    num:n,
    history:{ cc:'', spontaneous:false, nocturnal:false, referred:false, deepCaries:false, status:'virgin' },
    tests:{ cold:'nt', heat:'nt', ept:'nt', eptVal:'', perc:'nt', palp:'nt', bite:'nt', probe:'', probeIsolated:false, mobility:'', swelling:'none', sinus:'no' },
    radio:{ findings:[], notes:'' },
    dx:{ pulp:'', peri:'' },
    tx:{ proc:'NSRCT', status:'completed', recProc:'NSRCT', anesthesia:'', dam:true,
         canals: canalPresets(n).def.map(name => ({ name, wl:'', ref:'', maf:'' })),
         irrigants:['naocl','edta'], naoclConc:'', medicament:'', obturation:'', sealer:'', temp:'', material:'',
         findings:[], prognosis:'favorable', restor:'crown', restorTime:'30d', recall:'12m', notes:'' }
  };
}
function newCase(){
  const t = todayISO();
  return { id:uid(), createdAt:Date.now(), updatedAt:Date.now(),
    patient:{ title:'', first:'', last:'', dob:'', pid:'' }, procDate:t, letterDate:t,
    referrer:{ title:'Dr.', first:'', last:'', practice:'', address:'', phone:'', email:'' },
    teeth:[], images:[], letter:{ body:'', edited:false, salutation:'', edSal:false }, savedFiles:[], cc:'' };
}

/* ---------------- diagnosis engine (AAE terminology) ---------------- */
function suggestDx(t){
  const h = t.history, x = t.tests, rf = t.radio.findings;
  const why = { pulp:[], peri:[] }, warn = [];
  let pulp = '', peri = '';
  const vit = [['cold', x.cold], ['EPT', x.ept], ['heat', x.heat]].filter(([, v]) => v !== 'nt');
  const nr = vit.filter(([, v]) => v === 'nr');
  if(h.status === 'treated'){ pulp = 'PT'; why.pulp.push('Tooth has been endodontically treated'); }
  else if(h.status === 'initiated'){ pulp = 'PIT'; why.pulp.push('Endodontic therapy previously initiated'); }
  else if(!vit.length){
    if(h.spontaneous){ pulp = 'SIP'; why.pulp.push('Spontaneous pain reported (no pulp tests recorded)'); }
    warn.push('No pulp sensibility tests recorded - pulpal diagnosis cannot be confirmed.');
  } else if(nr.length === vit.length){
    pulp = 'PN'; why.pulp.push('No response to ' + listJoin(nr.map(v => v[0])));
  } else {
    if(nr.length) warn.push('Mixed pulp test responses (' + nr.map(v => v[0]).join(', ') + ' no response) - consider calcification, immature apex or multi-rooted partial necrosis.');
    if(x.cold === 'lingering' || x.heat === 'lingering' || h.spontaneous){
      pulp = 'SIP';
      if(x.cold === 'lingering') why.pulp.push('Lingering pain to cold');
      if(x.heat === 'lingering') why.pulp.push('Lingering pain to heat');
      if(h.spontaneous) why.pulp.push('Spontaneous pain');
      if(h.nocturnal) why.pulp.push('Nocturnal pain');
      if(h.referred) why.pulp.push('Referred pain');
    } else if(x.cold === 'exag'){
      pulp = 'RP'; why.pulp.push('Exaggerated, non-lingering response to cold');
      if(h.deepCaries || rf.includes('caries')) warn.push('Deep caries/exposure noted - asymptomatic irreversible pulpitis may apply if caries removal is expected to expose the pulp.');
    } else if(h.deepCaries){
      pulp = 'AIP'; why.pulp.push('Vital, asymptomatic pulp with deep caries / expected or actual exposure');
    } else {
      pulp = 'NP'; why.pulp.push('Normal responses to pulp testing');
    }
  }
  const tenderPerc = x.perc === 'tender', tenderPalp = x.palp === 'tender', bitePain = x.bite === 'pain';
  if(x.swelling !== 'none'){ peri = 'AAA'; why.peri.push((x.swelling === 'diffuse' ? 'Diffuse' : 'Localized') + ' swelling'); if(tenderPerc || tenderPalp) why.peri.push('Tenderness to ' + listJoin([tenderPerc && 'percussion', tenderPalp && 'palpation'])); }
  else if(x.sinus === 'yes'){ peri = 'CAA'; why.peri.push('Sinus tract present'); }
  else if(tenderPerc || tenderPalp || bitePain){ peri = 'SAP'; why.peri.push(cap(listJoin([tenderPerc && 'tender to percussion', tenderPalp && 'tender to palpation', bitePain && 'pain on biting']))); }
  else if(rf.includes('parl')){ peri = 'AAP'; why.peri.push('Periapical radiolucency without symptoms'); }
  else if(rf.includes('opacity')){ peri = 'CO'; why.peri.push('Diffuse periapical radiopacity'); }
  else if(x.perc !== 'nt' || x.palp !== 'nt'){ peri = 'NAT'; why.peri.push('Not tender to percussion/palpation, no periapical pathology recorded'); }
  if(peri && peri !== 'NAT' && rf.includes('parl') && !why.peri.join().includes('radiolucency')) why.peri.push('Periapical radiolucency');
  if(peri === 'AAA' && (pulp === 'NP' || pulp === 'RP')) warn.push('Swelling with a vital pulp is unusual - consider a periodontal or non-endodontic origin.');
  if(x.bite === 'release') warn.push('Pain on release of biting - evaluate for cracked tooth.');
  const pd = parseFloat(x.probe);
  if(x.probeIsolated || pd >= 6) warn.push(`${x.probeIsolated ? 'Isolated narrow probing defect' : 'Deep probing (' + pd + ' mm)'} - evaluate for vertical root fracture / endo-perio lesion.`);
  if(x.mobility === '2' || x.mobility === '3') warn.push(`Mobility grade ${x.mobility} - assess periodontal support.`);
  return { pulp, peri, why, warn };
}
function finalDx(t){ const s = suggestDx(t); return { pulp: t.dx.pulp || s.pulp, peri: t.dx.peri || s.peri, s }; }

/* ---------------- text generation ---------------- */
function ptName(c){ const p = c.patient; return [p.first, p.last].filter(Boolean).join(' ') || 'the patient'; }
function ptShort(c){ const p = c.patient; if(p.title && p.last) return p.title + ' ' + p.last; return p.first || ptName(c); }
function ptFile(c){ const p = c.patient; return [p.last, p.first].filter(Boolean).join(', ') || 'Unnamed patient'; }
function refName(c){ const r = c.referrer; return [r.title, r.first, r.last].filter(Boolean).join(' '); }
function teethRefs(c){ const ns = c.teeth.map(t => t.num); return ns.length ? (ns.length === 1 ? 'tooth ' : 'teeth ') + listJoin(ns.map(tRef)) : ''; }
function procOf(t){ return PROCS[t.tx.proc] || PROCS.NSRCT; }

function testPhrases(t){
  const x = t.tests, out = [];
  const cold = { wnl:'a normal response to cold', exag:'an exaggerated, non-lingering response to cold', lingering:'lingering pain to cold', nr:'no response to cold' }[x.cold];
  const heat = { wnl:'a normal response to heat', lingering:'lingering pain to heat', nr:'no response to heat' }[x.heat];
  const ept = { resp:'a response to electric pulp testing' + (x.eptVal ? ` (${x.eptVal})` : ''), nr:'no response to electric pulp testing' + (x.eptVal ? ` (${x.eptVal})` : '') }[x.ept];
  // merge "no response" items
  const nrs = []; if(x.cold === 'nr') nrs.push('cold'); if(x.ept === 'nr') nrs.push('electric pulp testing' + (x.eptVal ? ` (${x.eptVal})` : '')); if(x.heat === 'nr') nrs.push('heat');
  if(nrs.length > 1){ out.push('no response to ' + listJoin(nrs)); if(x.cold !== 'nr' && cold) out.push(cold); if(x.ept !== 'nr' && ept) out.push(ept); if(x.heat !== 'nr' && heat) out.push(heat); }
  else { if(cold) out.push(cold); if(ept) out.push(ept); if(heat) out.push(heat); }
  const tend = [], nont = [];
  (x.perc === 'tender' ? tend : x.perc === 'wnl' ? nont : []).push('percussion');
  (x.palp === 'tender' ? tend : x.palp === 'wnl' ? nont : []).push('palpation');
  if(tend.length) out.push('tenderness to ' + listJoin(tend));
  if(nont.length) out.push('no tenderness to ' + listJoin(nont));
  if(x.bite === 'pain') out.push('pain on biting'); else if(x.bite === 'release') out.push('pain on release of biting'); else if(x.bite === 'wnl') out.push('no pain on biting');
  return out;
}
function perioPhrase(t){
  const x = t.tests, p = [];
  if(x.probe !== '' && x.probe != null){ const pd = parseFloat(x.probe); p.push(x.probeIsolated ? `an isolated narrow probing defect of ${pd} mm` : pd <= 3 ? `probing depths within normal limits (${pd} mm or less)` : `probing depths up to ${pd} mm`); }
  else if(x.probeIsolated) p.push('an isolated narrow probing defect');
  if(x.mobility === '0') p.push('physiologic mobility'); else if(x.mobility) p.push(`grade ${x.mobility} mobility`);
  return p;
}
function swellPhrase(t){
  const x = t.tests;
  const sw = x.swelling === 'local' ? 'localized intraoral swelling' : x.swelling === 'diffuse' ? 'diffuse facial swelling' : '';
  const st = x.sinus === 'yes' ? 'a sinus tract' : '';
  if(sw || st) return cap(listJoin([sw, st])) + (sw && st ? ' were' : ' was') + ' noted.';
  return 'No swelling or sinus tract was noted.';
}
function radioPhrase(t){
  const f = t.radio.findings.map(k => RADIO[k]).filter(Boolean);
  let s = f.length ? cap(listJoin(f.map((v, i) => i ? v.toLowerCase().replace('pdl', 'PDL') : v))) : '';
  if(t.radio.notes) s = s ? s + '; ' + t.radio.notes.trim().replace(/\.$/, '') : t.radio.notes.trim().replace(/\.$/, '');
  return s ? s + '.' : '';
}
function canalNames(t){ return t.tx.canals.map(c => c.name).filter(Boolean); }
function irrigPhrase(t){
  const ir = t.tx.irrigants;
  const agents = ir.filter(k => !['us','sonic','negp'].includes(k)).map(k => k === 'naocl' ? (t.tx.naoclConc ? `${t.tx.naoclConc}% sodium hypochlorite` : 'sodium hypochlorite') : IRRIG[k].replace(/ \(.*\)/, '').replace(/^Sterile s/, 's').toLowerCase().replace('edta', 'EDTA'));
  const act = ir.filter(k => ['us','sonic','negp'].includes(k)).map(k => IRRIG[k].toLowerCase());
  if(!agents.length && !act.length) return '';
  return 'irrigated with ' + (agents.length ? listJoin(agents) : 'irrigant') + (act.length ? ' with ' + listJoin(act) : '');
}

function letterBody(c){
  const P = ptShort(c), parts = [];
  const tr = teethRefs(c);
  parts.push(`Thank you for referring ${ptName(c)} to our office. ${cap(P)} was seen on ${fmtLong(c.procDate)}${tr ? ' for evaluation and treatment of ' + tr : ''}. A summary of my findings and treatment follows.`);
  for(const t of c.teeth){
    const pr = procOf(t), dx = finalDx(t), tx = t.tx;
    const L = [];
    L.push(`**Tooth ${tRef(t.num)} (${toothInfo(t.num).name})**`);
    const hx = [];
    if(t.history.cc) hx.push(`${cap(P)} presented with ${t.history.cc.trim().replace(/\.$/, '')}.`);
    const sx = [t.history.spontaneous && 'spontaneous pain', t.history.nocturnal && 'pain that wakes the patient at night', t.history.referred && 'referred pain'].filter(Boolean);
    if(sx.length) hx.push(`History includes ${listJoin(sx)}.`);
    if(t.history.status === 'treated') hx.push('The tooth has had previous root canal treatment.');
    if(t.history.status === 'initiated') hx.push('Endodontic therapy had previously been initiated.');
    const tp = testPhrases(t), pp = perioPhrase(t);
    let clin = '';
    if(tp.length || pp.length) clin = `Clinical testing revealed ${listJoin([...tp, ...pp])}. `;
    clin += swellPhrase(t);
    const rp = radioPhrase(t);
    let p1 = [hx.join(' '), clin, rp && `Radiographic examination: ${rp}`].filter(Boolean).join(' ');
    L.push(p1);
    const dxs = [dx.pulp && PULP_DX[dx.pulp], dx.peri && PERI_DX[dx.peri]].filter(Boolean);
    if(dxs.length) L.push(`Diagnosis: ${dx.pulp ? PULP_DX[dx.pulp] : 'pulpal diagnosis pending'}${dx.peri ? ' with ' + PERI_DX[dx.peri].toLowerCase() : ''}.`);
    // treatment
    if(pr.eval){
      let s = `Treatment recommendation: ${REC_PROC[tx.recProc] || ''}.`;
      L.push(s);
    } else {
      const verb = tx.status === 'completed' ? 'was completed' : tx.status === 'initiated' ? 'was initiated' : 'is recommended';
      let s = `${pr.long.replace(/ \(.*\)/, '')} ${verb}`;
      if(tx.status !== 'recommended'){
        const iso = [tx.anesthesia ? `local anesthesia (${tx.anesthesia.trim()})` : 'local anesthesia', tx.dam && !pr.nodam ? 'rubber dam isolation' : ''].filter(Boolean);
        s += ` under ${listJoin(iso)}.`;
        const names = canalNames(t);
        if(pr.canals && names.length){
          const single = names.length === 1 && /^single/i.test(names[0]);
          const steps = pr.obt ? 'located, cleaned and shaped' : 'located and debrided';
          let cs = single ? `The canal was ${steps}` : `${cap(numWord(names.length))} canals (${names.join(', ')}) were ${steps}`;
          const ir = irrigPhrase(t), obtd = pr.obt && tx.status === 'completed' && tx.obturation;
          if(ir) cs += obtd ? `, ${ir}` : `, and ${ir}`;
          if(obtd) cs += `, and obturated using ${OBTUR[tx.obturation].toLowerCase()}${tx.sealer ? ' with ' + tx.sealer.trim() + ' sealer' : ''}`;
          s += ' ' + cs + '.';
        } else if(pr.obt && tx.status === 'completed' && tx.obturation){ s += ` The root canal system was obturated using ${OBTUR[tx.obturation].toLowerCase()}${tx.sealer ? ' with ' + tx.sealer.trim() + ' sealer' : ''}.`; }
        if(pr.material && tx.material) s += ` ${pr.material}: ${tx.material.trim()}.`;
        if(tx.medicament) s += ` ${tx.medicament === 'other' ? 'An intracanal medicament' : MEDIC[tx.medicament]} was placed${tx.medicament === 'other' ? '' : ' as an intracanal medicament'}.`;
        if(!pr.notemp && tx.temp) s += ` The access was sealed with ${TEMP_PHRASE[tx.temp]}.`;
        if(tx.status === 'initiated') s += ` ${cap(P)} will return to complete treatment.`;
      } else s += '.';
      L.push(s);
      if(tx.findings.length) L.push(`Of note: ${listJoin(tx.findings.map((k, i) => i ? FINDINGS[k].toLowerCase().replace('mb2', 'MB2') : FINDINGS[k]))}.`);
    }
    if(tx.notes) L.push(tx.notes.trim());
    if(tx.prognosis) L.push(`Prognosis: ${PROG[tx.prognosis]}.`);
    const rec = [];
    if(!pr.eval && tx.restor && tx.restor !== 'none'){
      if(tx.restor === 'pending') rec.push('Please defer the final restoration until endodontic treatment has been completed.');
      else {
        const what = { crown:'a full-coverage crown', onlay:'a cuspal-coverage onlay', postcore:'a post/core build-up and crown', direct:'a bonded direct restoration', access:'a permanent restoration of the access cavity' }[tx.restor];
        rec.push(`Please place ${what}${RTIME[tx.restorTime] ? ' ' + RTIME[tx.restorTime] : ''}${['crown','onlay','postcore'].includes(tx.restor) ? ' to protect the tooth against fracture and coronal leakage' : ' to provide a coronal seal'}.`);
      }
    }
    if(tx.recall) rec.push(`We would like to see ${P} for a recall examination at ${RECALL[tx.recall]} to evaluate healing.`);
    if(rec.length) L.push(rec.join(' '));
    parts.push(L.join('\n'));
  }
  parts.push(`Thank you for the opportunity to participate in ${P}'s care. Please do not hesitate to contact me if you have any questions.`);
  return parts.join('\n\n');
}
function salutation(c){ const r = c.referrer; return `Dear ${r.last ? (r.title || 'Dr.') + ' ' + r.last : 'Doctor'},`; }

function glanceLines(t){
  const pr = procOf(t), dx = finalDx(t), tx = t.tx;
  const head = pr.eval ? `${tRef(t.num)}  Evaluation` : `${tRef(t.num)}  ${pr.short} - ${STATUS_SHORT[tx.status]}`;
  const lines = [];
  lines.push(['Dx', [dx.pulp && PULP_DX[dx.pulp], dx.peri && PERI_DX[dx.peri]].filter(Boolean).join(' / ') || '—']);
  if(pr.eval) lines.push(['Rec', REC_PROC[tx.recProc] || '—']);
  if(!pr.eval && pr.canals && tx.status !== 'recommended'){
    const cs = tx.canals.filter(c => c.name);
    if(cs.length){
      const wls = cs.filter(c => c.wl);
      lines.push(['Canals', `${cs.length}: ` + cs.map(c => c.name + (c.wl ? ' ' + c.wl : '')).join(', ') + (wls.length ? ' mm (WL)' : '')]);
    }
  }
  if(!pr.eval && tx.status !== 'recommended'){
    const o = [];
    if(pr.obt && tx.status === 'completed' && tx.obturation) o.push(OBTUR[tx.obturation].replace(' condensation', '').replace(' of', '') + (tx.sealer ? ', ' + tx.sealer : ''));
    if(tx.medicament) o.push(tx.medicament === 'caoh' ? 'Ca(OH)2' : MEDIC[tx.medicament]);
    if(pr.material && tx.material) o.push(tx.material);
    if(!pr.notemp && tx.temp) o.push('Temp: ' + TEMP[tx.temp]);
    if(o.length) lines.push([tx.status === 'completed' && pr.obt && tx.obturation ? 'Obturation' : 'Placed', o.join(' · ')]);
  }
  const nx = [];
  if(!pr.eval && tx.restor && tx.restor !== 'none') nx.push(RESTOR[tx.restor] + (tx.restor !== 'pending' && RTIME[tx.restorTime] ? ' ' + RTIME[tx.restorTime] : ''));
  if(tx.status === 'initiated' && !pr.eval) nx.unshift('Completion visit pending');
  if(tx.recall) nx.push('Recall ' + RECALL_SHORT[tx.recall]);
  if(nx.length) lines.push(['Your next step', nx.join(' · ')]);
  if(tx.prognosis) lines.push(['Prognosis', PROG[tx.prognosis]]);
  return { head, lines };
}

function chartNote(c){
  const p = c.patient, L = [];
  L.push(`ENDODONTIC NOTE - ${fmtShort(c.procDate)}`);
  L.push(`Patient: ${ptFile(c)}${p.dob ? ' (DOB ' + fmtShort(p.dob) + ')' : ''}${p.pid ? '  ID: ' + p.pid : ''}`);
  if(refName(c)) L.push(`Referred by: ${refName(c)}${c.referrer.practice ? ', ' + c.referrer.practice : ''}`);
  for(const t of c.teeth){
    const x = t.tests, h = t.history, tx = t.tx, pr = procOf(t), dx = finalDx(t);
    L.push('');
    L.push(`Tooth ${tRef(t.num)} (${toothInfo(t.num).name})`);
    if(h.cc) L.push(`CC: ${h.cc}`);
    const hx = [h.spontaneous && 'spontaneous pain', h.nocturnal && 'nocturnal pain', h.referred && 'referred pain', h.deepCaries && 'deep caries/exposure', h.status === 'treated' && 'previously treated', h.status === 'initiated' && 'previously initiated'].filter(Boolean);
    if(hx.length) L.push(`Hx: ${hx.join('; ')}`);
    const ab = { nt:'NT', wnl:'WNL', exag:'exaggerated/non-lingering', lingering:'lingering', nr:'NR', resp:'+', tender:'+', pain:'+', release:'+ on release' };
    const tests = [`Cold ${ab[x.cold]}`, `EPT ${ab[x.ept]}${x.eptVal ? ' (' + x.eptVal + ')' : ''}`, `Heat ${ab[x.heat]}`, `Perc ${x.perc === 'wnl' ? '-' : ab[x.perc]}`, `Palp ${x.palp === 'wnl' ? '-' : ab[x.palp]}`, `Bite ${x.bite === 'wnl' ? '-' : ab[x.bite]}`,
      `PD ${x.probe !== '' ? x.probe + ' mm' : 'NT'}${x.probeIsolated ? ' (isolated narrow defect)' : ''}`, `Mob ${x.mobility !== '' ? x.mobility : 'NT'}`, `Swelling ${T_SWELL[x.swelling].toLowerCase()}`, `Sinus tract ${x.sinus === 'yes' ? 'present' : 'none'}`];
    L.push(`Tests: ${tests.join(' | ')}`);
    const rp = radioPhrase(t); if(rp) L.push(`Radiographic: ${rp}`);
    L.push(`Dx: Pulpal - ${dx.pulp ? PULP_DX[dx.pulp] : 'TBD'}; Periapical - ${dx.peri ? PERI_DX[dx.peri] : 'TBD'}`);
    if(pr.eval) L.push(`Tx: Evaluation. Recommended: ${REC_PROC[tx.recProc]}`);
    else {
      L.push(`Tx: ${pr.long} - ${STATUS[tx.status].toLowerCase()}.${tx.status !== 'recommended' ? (tx.anesthesia ? ' LA: ' + tx.anesthesia + '.' : ' LA.') + (tx.dam && !pr.nodam ? ' RDI.' : '') : ''}`);
      if(tx.status !== 'recommended'){
        if(pr.canals){ const cs = tx.canals.filter(k => k.name); if(cs.length) L.push('  Canals: ' + cs.map(k => `${k.name}${k.wl ? ' WL ' + k.wl + ' mm' : ''}${k.ref ? ' (ref ' + k.ref + ')' : ''}${k.maf ? ' MAF ' + k.maf : ''}`).join('; ')); }
        if(pr.canals && tx.irrigants.length) L.push('  Irrigation: ' + tx.irrigants.map(k => k === 'naocl' && tx.naoclConc ? `NaOCl ${tx.naoclConc}%` : IRRIG[k]).join(', '));
        if(pr.obt && tx.status === 'completed' && tx.obturation) L.push(`  Obturation: ${OBTUR[tx.obturation]}${tx.sealer ? ', ' + tx.sealer + ' sealer' : ''}`);
        if(tx.medicament) L.push(`  Medicament: ${MEDIC[tx.medicament]}`);
        if(pr.material && tx.material) L.push(`  ${pr.material}: ${tx.material}`);
        if(!pr.notemp && tx.temp) L.push(`  Temp: ${TEMP[tx.temp]}`);
        if(tx.findings.length) L.push('  Findings: ' + tx.findings.map(k => FINDINGS[k]).join('; '));
      }
    }
    if(tx.notes) L.push(`Notes: ${tx.notes}`);
    if(tx.prognosis) L.push(`Prognosis: ${PROG[tx.prognosis]}`);
    const plan = [];
    if(!pr.eval && tx.status === 'initiated') plan.push('RTC to complete treatment');
    if(!pr.eval && tx.restor && tx.restor !== 'none') plan.push(RESTOR[tx.restor] + (tx.restor !== 'pending' && RTIME[tx.restorTime] ? ' ' + RTIME[tx.restorTime] : ''));
    if(tx.recall) plan.push('recall ' + RECALL[tx.recall]);
    if(plan.length) L.push(`Plan: ${cap(plan.map((x, i) => i ? x[0].toLowerCase() + x.slice(1) : x).join('; '))}`);
  }
  if(!c.teeth.length) L.push('', '(No teeth selected)');
  return L.join('\n');
}

/* ---------------- odontogram (shared by UI and PDF) ---------------- */
const DIMS = {
  U:{1:[27,25,34,1],2:[22,22,31,1],3:[24,25,42,1,'c'],4:[24,21,32,2],5:[23,21,33,1],6:[33,20,30,3],7:[31,20,28,3],8:[28,18,24,3]},
  L:{1:[18,21,31,1],2:[19,21,32,1],3:[22,24,40,1,'c'],4:[22,21,34,1],5:[23,21,35,1],6:[34,20,31,2],7:[32,19,29,2],8:[29,18,25,2]},
};
function toothGeom(n, cx){
  const ti = toothInfo(n), [cw, ch, rl, nr, edge] = DIMS[ti.arch][ti.pos];
  const L = cx - cw/2, R = cx + cw/2, w = cw, cL = cx - cw*0.38, cR = cx + cw*0.38;
  let occ;
  if(ti.type === 'molar') occ = `Q${L+w/6} -2 ${L+w/3} 3 Q${cx} -2 ${R-w/3} 3 Q${R-w/6} -2 ${R} 5`;
  else if(ti.type === 'premolar') occ = `Q${L+w/4} -2 ${cx} 3 Q${R-w/4} -2 ${R} 5`;
  else if(edge === 'c') occ = `Q${L+w*.25} 1 ${cx} -3 Q${R-w*.25} 1 ${R} 5`;
  else occ = `Q${cx} 0 ${R} 5`;
  const crown = `M${cL} ${ch} C${L} ${ch*.75} ${L} ${ch*.45} ${L} 5 ${occ} C${R} ${ch*.45} ${R} ${ch*.75} ${cR} ${ch} Z`;
  const roots = [], canals = [];
  const root = (rx, rw, len, sh) => {
    const y0 = ch - 3, y1 = ch + len;
    roots.push(`M${rx-rw/2} ${y0} C${rx-rw/2} ${ch+len*.55} ${rx+sh-rw*.22} ${y1} ${rx+sh} ${y1} C${rx+sh+rw*.22} ${y1} ${rx+rw/2} ${ch+len*.55} ${rx+rw/2} ${y0} Z`);
    canals.push([rx, ch*.55, rx+sh*.95, y1 - 2.5]);
  };
  if(nr === 1) root(cx, ti.type === 'canine' ? 12 : ti.type === 'incisor' ? 10 : 11, rl, 0);
  else if(nr === 2 && ti.type === 'premolar') { root(cx-4.5, 8, rl, -1.5); root(cx+4.5, 8, rl, 1.5); }
  else { if(nr === 3) root(cx, 10, rl+2, 0); root(cx-cw*.24, 10, rl, -2.5); root(cx+cw*.24, 10, rl, 2.5); }
  return { crown, roots, canals, ch, rl, ti };
}
// marks: {num: 'completed'|'initiated'|'recommended'|'eval'}, active: num
function odontogramSVG(marks, opt = {}){
  const acc = opt.accent || S.settings.accent || '#1F6F8B';
  const soft = mix(acc, '#FFFFFF', .62), pale = mix(acc, '#FFFFFF', .9);
  const CW = 36, X0 = 12, GAP = 8, UOCC = 88, LOCC = 100;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" class="odo" font-family="Helvetica, Arial, sans-serif">`;
  s += `<rect width="600" height="190" fill="${opt.bg || 'transparent'}"/>`;
  s += `<line x1="300" y1="8" x2="300" y2="182" stroke="#D5DCE3" stroke-width="1" stroke-dasharray="3 3"/>`;
  s += `<line x1="8" y1="94" x2="592" y2="94" stroke="#D5DCE3" stroke-width="1" stroke-dasharray="3 3"/>`;
  for(let i = 0; i < 32; i++){
    const upper = i < 16, idx = upper ? i : i - 16;
    const n = upper ? i + 1 : 32 - idx;
    const cx = X0 + CW/2 + idx*CW + (idx >= 8 ? GAP : 0);
    const g = toothGeom(n, cx), m = marks[n], act = opt.active === n;
    let cf = '#F6F8FA', cs = '#A3AEB9', rf = '#FBFCFD', dash = '', sw = 1, canal = '';
    if(m === 'completed'){ cf = acc; cs = mix(acc, '#000000', .25); rf = soft; canal = '#FFFFFF'; sw = 1.2; }
    else if(m === 'initiated'){ cf = soft; cs = acc; rf = pale; dash = '3 2'; sw = 1.3; canal = acc; }
    else if(m === 'recommended' || m === 'eval'){ cf = pale; cs = acc; rf = '#FFFFFF'; dash = '3 2'; sw = 1.3; }
    const tf = upper ? `translate(0 ${UOCC}) scale(1 -1)` : `translate(0 ${LOCC})`;
    s += `<g class="t" data-tooth="${n}"><rect x="${cx-CW/2}" y="${upper ? 0 : 95}" width="${CW}" height="95" fill="transparent"/>`;
    if(act) s += `<rect x="${cx-CW/2+1}" y="${upper ? 4 : 97}" width="${CW-2}" height="89" rx="6" fill="none" stroke="${acc}" stroke-width="1.6"/>`;
    s += `<g transform="${tf}">`;
    for(const r of g.roots) s += `<path d="${r}" fill="${rf}" stroke="${cs}" stroke-width="${sw}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
    s += `<path class="cr" d="${g.crown}" fill="${cf}" stroke="${cs}" stroke-width="${sw}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
    if(canal && m === 'completed') for(const [x1,y1,x2,y2] of g.canals) s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${acc}" stroke-width="2.2" stroke-linecap="round"/>`;
    else if(canal) for(const [x1,y1,x2,y2] of g.canals) s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${canal}" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 2"/>`;
    s += `</g>`;
    const ly = upper ? 12 : 184, lab = opt.labels ? opt.labels(n) : tLabel(n);
    s += `<text x="${cx}" y="${upper ? (opt.big ? 15 : 12) : (opt.big ? 186 : 184)}" text-anchor="middle" font-size="${opt.big ? (m ? 17 : 13) : (m ? 11.5 : 10)}" font-weight="${m ? 700 : 400}" fill="${m ? acc : '#8A96A3'}">${lab}</text></g>`;
  }
  s += `</svg>`;
  return s;
}
function hex2rgb(h){ h = h.replace('#',''); if(h.length === 3) h = h.split('').map(c => c + c).join(''); return [0,2,4].map(i => parseInt(h.slice(i, i+2), 16)); }
function mix(a, b, t){ const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function caseMarks(c){ const m = {}; for(const t of c.teeth) m[t.num] = procOf(t).eval ? 'eval' : t.tx.status; return m; }
function svgToPng(svg, w, h){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); res(cv.toDataURL('image/png')); };
    img.onerror = () => rej(new Error('Could not render dentition chart'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

/* ---------------- PDF letter ---------------- */
function pdfSafe(s){
  return String(s ?? '').replace(/[‘’‛]/g, "'").replace(/[“”]/g, '"').replace(/[–—−]/g, '-').replace(/…/g, '...')
    .replace(/•/g, '·').replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/ /g, ' ').replace(/[^\x00-\xFF]/g, '?');
}
async function buildPDF(c){
  const st = S.settings, { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format: st.paper === 'A4' ? 'a4' : 'letter' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 20, CWd = W - 2*M, BOTTOM = H - 22;
  const acc = hex2rgb(st.accent || '#1F6F8B'), ink = [28,36,44], gray = [110,120,130], light = [160,168,176];
  const T = s => pdfSafe(s);
  const setC = c3 => doc.setTextColor(c3[0], c3[1], c3[2]);
  doc.setProperties({ title:`Endodontic report - ${ptFile(c)} - ${c.procDate}`, subject:'Endodontic referral report', author: T(docName()), creator:'EndoLetter' });
  doc.setLineHeightFactor(1.35);
  let y = 16;
  // ---- letterhead
  let tx = M;
  if(st.logo){
    try{ const im = await loadImg(st.logo); const lh = 18, lw = Math.min(42, im.width / im.height * lh); doc.addImage(st.logo, 'PNG', M, y - 2, lw, lw / (im.width / im.height), 'logo', 'FAST'); tx = M + lw + 5; } catch(e){}
  }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15.5); setC(acc);
  doc.text(T(st.practiceName || 'Endodontic Practice'), tx, y + 4);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); setC(ink);
  const dn = docName(); if(dn) doc.text(T(dn), tx, y + 10);
  if(st.tagline){ doc.setFont('helvetica', 'italic'); doc.setFontSize(8.8); setC(gray); doc.text(T(st.tagline), tx, y + (dn ? 15 : 10)); }
  const contact = [st.address1, st.address2, [st.phone && 'Tel ' + st.phone, st.fax && 'Fax ' + st.fax].filter(Boolean).join('  ·  '), st.email, st.website].filter(Boolean);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.3); setC(gray);
  contact.forEach((l, i) => doc.text(T(l), W - M, y + 2 + i * 3.9, { align:'right' }));
  y = Math.max(y + 20, y + 4 + contact.length * 3.9);
  doc.setDrawColor(acc[0], acc[1], acc[2]); doc.setLineWidth(0.7); doc.line(M, y, W - M, y);
  doc.setLineWidth(0.2); doc.line(M, y + 1.1, W - M, y + 1.1);
  y += 9;
  // ---- date + recipient
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); setC(ink);
  doc.text(T(fmtLong(c.letterDate || c.procDate)), M, y); y += 8;
  const r = c.referrer;
  const rec = [refName(c), r.practice, ...(r.address || '').split('\n')].map(s => s && s.trim()).filter(Boolean);
  rec.forEach((l, i) => { doc.setFont('helvetica', i === 0 ? 'bold' : 'normal'); doc.text(T(l), M, y); y += 4.6; });
  y += 4;
  // ---- RE block
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); setC(ink); doc.text('RE:', M, y);
  const reRows = [['Patient', ptName(c) + (c.patient.pid ? `   (ID ${c.patient.pid})` : '')], ['Date of birth', c.patient.dob ? fmtLong(c.patient.dob) : '—'], ['Date of treatment', fmtLong(c.procDate)], [c.teeth.length > 1 ? 'Teeth' : 'Tooth', c.teeth.map(t => tRef(t.num)).join(', ') || '—']];
  const reX = M + 10;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  const lw = [0, 1].map(col => Math.max(...reRows.filter((_, i) => i % 2 === col).map(([k]) => doc.getTextWidth(k.toUpperCase()))) + 3);
  const col2X = reX + lw[0] + 62;
  reRows.forEach(([k, v], i) => {
    const col = i % 2, row = Math.floor(i / 2), xx = col ? col2X : reX, yy = y + row * 5.2;
    doc.setFont('helvetica', 'normal'); setC(gray); doc.setFontSize(8); doc.text(T(k.toUpperCase()), xx, yy);
    doc.setFont('helvetica', 'bold'); setC(ink); doc.setFontSize(10); doc.text(T(v), xx + lw[col], yy, { maxWidth: col ? W - M - xx - lw[col] : col2X - reX - lw[0] - 3 });
  });
  y += 14;
  // ---- treatment at a glance
  if(c.teeth.length){
    const bx = M, bw = CWd, pad = 5, KW = 21, LS = 3.55;
    const multi = c.teeth.length > 1;
    const imgW = multi ? 96 : 84, imgH = imgW * 190 / 600;
    const png = await svgToPng(odontogramSVG(caseMarks(c), { accent: st.accent, bg:'#FFFFFF', big:true }), 2400, 760);
    const blocks = c.teeth.map(glanceLines);
    // column geometry: single tooth -> text beside chart; several -> two columns under chart
    const cols = multi ? [0, 1].map(i => ({ x: bx + pad + i * ((bw - 2*pad + 8) / 2), w: (bw - 2*pad - 8) / 2 })) : [{ x: bx + pad + imgW + 7, w: bw - 2*pad - imgW - 7 }];
    doc.setFontSize(8.3); doc.setFont('helvetica', 'normal');
    const prep = (b, w) => ({ b, rows: b.lines.map(([k, v]) => [k, doc.splitTextToSize(T(v), w - KW)]) });
    const bh_ = pb => 4.8 + pb.rows.reduce((a, [, ls]) => a + ls.length * LS + 0.65, 0);
    const placed = [];  // {pb, col, y}
    const colY = cols.map(() => 0);
    blocks.forEach((b, i) => { const ci = multi ? colY.indexOf(Math.min(...colY)) : 0; const pb = prep(b, cols[ci].w); placed.push({ pb, ci, off: colY[ci] }); colY[ci] += bh_(pb) + 3; });
    const textH = Math.max(...colY) - 3;
    const top = 9.5;
    const textTop = multi ? top + imgH + 8 : top + 1.8;
    const bh = Math.max(multi ? 0 : top + imgH + 7.5, textTop + textH) + pad - 1.5;
    if(y + bh > BOTTOM) newPage();
    const tr = hex2rgb(mix(st.accent || '#1F6F8B', '#FFFFFF', .94));
    doc.setFillColor(tr[0], tr[1], tr[2]); doc.setDrawColor(...mixRGB(acc, .55)); doc.setLineWidth(0.3);
    doc.roundedRect(bx, y, bw, bh, 2.2, 2.2, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.6); setC(acc);
    doc.text('TREATMENT AT A GLANCE', bx + pad, y + 5.6, { charSpace: 0.45 });
    doc.setFillColor(255, 255, 255); doc.setDrawColor(...mixRGB(acc, .75)); doc.roundedRect(bx + pad, y + 8, imgW, imgH, 1.5, 1.5, 'FD');
    doc.addImage(png, 'PNG', bx + pad + 0.6, y + 8.4, imgW - 1.2, imgH - 0.8, 'odo', 'FAST');
    // legend: beside the chart (multi) or under it (single)
    const used = new Set(Object.values(caseMarks(c)));
    const leg = [['completed','Completed'], ['initiated','Initiated'], ['recommended','Recommended / evaluated']].filter(([k]) => used.has(k) || (k === 'recommended' && used.has('eval')));
    let lx = multi ? bx + pad + imgW + 7 : bx + pad, ly = multi ? y + 12 : y + 8 + imgH + 4;
    doc.setFontSize(7.3); doc.setFont('helvetica', 'normal');
    if(multi){ doc.setFont('helvetica', 'bold'); setC(ink); doc.setFontSize(9); doc.text(T(`${c.teeth.length} teeth treated: ` + c.teeth.map(t => tRef(t.num)).join(', ')), lx, ly); ly += 6; doc.setFont('helvetica', 'normal'); doc.setFontSize(7.3); }
    for(const [k, lab] of leg){
      const soft = mixRGB(acc, .62), pale = mixRGB(acc, .9);
      if(k === 'completed'){ doc.setFillColor(...acc); doc.setDrawColor(...acc); }
      else if(k === 'initiated'){ doc.setFillColor(...soft); doc.setDrawColor(...acc); doc.setLineDashPattern([0.7, 0.5], 0); }
      else { doc.setFillColor(...pale); doc.setDrawColor(...acc); doc.setLineDashPattern([0.7, 0.5], 0); }
      doc.roundedRect(lx, ly - 2.4, 2.9, 2.9, 0.5, 0.5, 'FD'); doc.setLineDashPattern([], 0);
      setC(gray); doc.text(lab, lx + 4.2, ly);
      if(multi) ly += 4.6; else lx += 4.2 + doc.getTextWidth(lab) + 5;
    }
    for(const { pb, ci, off } of placed){
      const x0 = cols[ci].x; let ty = y + textTop + off + 3.2;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.8); setC(acc); doc.text(T(pb.b.head), x0, ty); ty += 4.8;
      doc.setFontSize(8.3);
      for(const [k, ls] of pb.rows){
        doc.setFont('helvetica', 'bold'); setC(gray); doc.text(T(k), x0, ty);
        doc.setFont('helvetica', 'normal'); setC(ink);
        ls.forEach((l, j) => doc.text(l, x0 + KW, ty + j * LS));
        ty += ls.length * LS + 0.65;
      }
    }
    y += bh + 8;
  }
  // ---- salutation + body
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.2); setC(ink);
  const LH = 4.75;
  const sal = c.letter.edSal && c.letter.salutation ? c.letter.salutation : salutation(c);
  need(LH * 2); doc.text(T(sal), M, y); y += LH + 2.4;
  const body = (c.letter.edited ? c.letter.body : letterBody(c)) || '';
  for(const para of body.split(/\n\s*\n/)){
    const lines = para.split('\n');
    for(const raw of lines){
      const hm = raw.trim().match(/^\*\*(.+)\*\*$/);
      if(hm){ need(LH * 3); y += 1; doc.setFont('helvetica', 'bold'); setC(acc); doc.setFontSize(10.4); doc.text(T(hm[1]), M, y); y += LH + 0.6; doc.setFont('helvetica', 'normal'); setC(ink); doc.setFontSize(10.2); continue; }
      const wrapped = doc.splitTextToSize(T(raw), CWd);
      for(const wl of wrapped){ need(LH); doc.text(wl, M, y); y += LH; }
      y += 1.3;
    }
    y += 2.6;
  }
  // ---- closing & signature
  need(34);
  y += 1; doc.text(T(st.closing || 'Sincerely,'), M, y); y += 3;
  if(st.signature){ try{ const im = await loadImg(st.signature); const sh = 13, sw = Math.min(55, im.width / im.height * sh); doc.addImage(st.signature, 'PNG', M, y, sw, sw / (im.width / im.height), 'sig', 'FAST'); y += sw / (im.width / im.height) + 3; } catch(e){ y += 14; } }
  else y += 13;
  doc.setFont('helvetica', 'bold'); doc.text(T(docName() || ''), M, y); y += LH;
  doc.setFont('helvetica', 'normal'); setC(gray); doc.setFontSize(9);
  if(st.practiceName){ doc.text(T(st.practiceName), M, y); y += 4.2; }
  // ---- radiographs
  const imgs = c.images.filter(i => i.include !== false && i.data);
  if(imgs.length){
    y += 6;
    need(70);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.4); setC(acc); doc.text('Radiographs', M, y); y += 2.5;
    doc.setDrawColor(...mixRGB(acc, .7)); doc.setLineWidth(0.25); doc.line(M, y, W - M, y); y += 5;
    const colW = (CWd - 6) / 2, maxH = 68;
    for(let i = 0; i < imgs.length; i += 2){
      const row = imgs.slice(i, i + 2).map(im => { const ar = im.w / im.h; let w = colW, h = w / ar; if(h > maxH){ h = maxH; w = h * ar; } return { im, w, h }; });
      const rh = Math.max(...row.map(o => o.h)) + 9;
      need(rh);
      row.forEach((o, j) => {
        const x0 = M + j * (colW + 6) + (colW - o.w) / 2;
        doc.setFillColor(20, 20, 20); doc.rect(x0, y, o.w, o.h, 'F');
        doc.addImage(o.im.data, 'JPEG', x0, y, o.w, o.h);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8.3); setC(gray);
        doc.text(T(o.im.caption || ''), M + j * (colW + 6) + colW / 2, y + o.h + 4.3, { align:'center', maxWidth: colW });
      });
      y += rh + 3;
    }
  }
  // ---- footers
  const n = doc.getNumberOfPages();
  for(let i = 1; i <= n; i++){
    doc.setPage(i);
    doc.setDrawColor(215, 220, 226); doc.setLineWidth(0.2); doc.line(M, H - 15, W - M, H - 15);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.9); setC(light);
    if(st.confidential !== false) doc.text('CONFIDENTIAL: This letter contains protected health information intended only for the addressee. If received in error, please notify the sender and destroy it.', M, H - 11, { maxWidth: CWd - 22 });
    doc.text(`Page ${i} of ${n}`, W - M, H - 11, { align:'right' });
    if(i > 1){
      doc.setFontSize(8); setC(gray);
      doc.text(T(`${st.practiceName || ''}`), M, 12);
      doc.text(T(`${ptName(c)}  ·  ${fmtLong(c.procDate)}`), W - M, 12, { align:'right' });
      doc.setDrawColor(...mixRGB(acc, .6)); doc.setLineWidth(0.3); doc.line(M, 14.5, W - M, 14.5);
    }
  }
  return doc.output('blob');

  function newPage(){ doc.addPage(); y = 24; doc.setFont('helvetica', 'normal'); doc.setFontSize(10.2); setC(ink); }
  function need(h){ if(y + h > BOTTOM){ const f = doc.getFont(), fs = doc.getFontSize(), tc = doc.getTextColor(); newPage(); doc.setFont(f.fontName, f.fontStyle); doc.setFontSize(fs); doc.setTextColor(tc); } }
  function mixRGB(a, t){ return a.map(v => Math.round(v + (255 - v) * t)); }
}
function docName(){ const st = S.settings; return [st.doctorName, st.credentials].filter(Boolean).join(', '); }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function downscale(file, max, type = 'image/jpeg', q = 0.88){
  const url = URL.createObjectURL(file);
  try{
    const im = await loadImg(url); let { width:w, height:h } = im; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d');
    if(type === 'image/jpeg'){ x.fillStyle = '#000'; x.fillRect(0, 0, w, h); }
    x.drawImage(im, 0, 0, w, h); return { data: cv.toDataURL(type, q), w, h };
  } finally { URL.revokeObjectURL(url); }
}

/* ---------------- file naming ---------------- */
function safeName(s){ return String(s).replace(/[\\/:*?"<>|\u0000-\u001F]/g, '').replace(/\s+/g, ' ').trim().replace(/\.+$/, '') || 'Untitled'; }
function letterFileBase(c){
  const ns = c.teeth.map(t => tLabel(t.num));
  const teeth = ns.length ? (ns.length === 1 ? 'Tooth ' + ns[0] : 'Teeth ' + ns.join(', ')) : 'Consult';
  const procs = [...new Set(c.teeth.map(t => procOf(t).short.replace('&', 'and')))].join(', ');
  return safeName(`${c.procDate} - ${ptFile(c)} - ${teeth}${procs ? ' ' + procs : ''}`);
}
function patientFolder(c){ return safeName(ptFile(c) + (c.patient.dob ? ` (DOB ${c.patient.dob})` : '')); }

/* ---------------- folder storage (File System Access API) ---------------- */
const FS = {
  supported: typeof window.showDirectoryPicker === 'function',
  root: null, perm: 'none', lastBackup: 0, written: new Set(), busy: false, pending: false, error: '',
  async init(){
    const h = await DB.get('kv', 'dirHandle');
    if(!h) return;
    this.root = h;
    try{ this.perm = await h.queryPermission({ mode:'readwrite' }); } catch(e){ this.perm = 'prompt'; }
    this.lastBackup = (await DB.get('kv', 'lastBackup')) || 0;
  },
  ok(){ return this.root && this.perm === 'granted'; },
  async pick(){
    const h = await window.showDirectoryPicker({ id:'endoletter', mode:'readwrite', startIn:'documents' });

  },
  async reconnect(){ if(!this.root) return false; try{ this.perm = await this.root.requestPermission({ mode:'readwrite' }); } catch(e){ this.perm = 'denied'; } return this.perm === 'granted'; },
  async ensure(){ if(this.ok()) return true; if(this.root){ return await this.reconnect(); } return false; },
  async dir(parts, create = true){ let d = this.root; for(const p of parts) d = await d.getDirectoryHandle(p, { create }); return d; },
  async write(parts, data){ const d = await this.dir(parts.slice(0, -1)); const fh = await d.getFileHandle(parts[parts.length - 1], { create:true }); const w = await fh.createWritable(); await w.write(data); await w.close(); },
  async exists(parts){ try{ const d = await this.dir(parts.slice(0, -1), false); await d.getFileHandle(parts[parts.length - 1]); return true; } catch(e){ return false; } },
  async read(parts){ const d = await this.dir(parts.slice(0, -1), false); const fh = await d.getFileHandle(parts[parts.length - 1]); return await fh.getFile(); },
  async remove(parts){ try{ const d = await this.dir(parts.slice(0, -1), false); await d.removeEntry(parts[parts.length - 1]); } catch(e){} },
};
const DATA_DIR = 'App Data (do not edit)';
function backupPayload(inlineImages){
  const cases = [...S.cases.values()].map(c => { const o = clone(c); o.images = o.images.map(im => { const r = { ...im }; if(!inlineImages){ delete r.data; r.file = `Images/${c.id}-${im.id}.jpg`; } return r; }); return o; });
  const settings = { ...S.settings }; if(!inlineImages){ /* logo/signature kept inline: small */ }
  return { app:'EndoLetter', format:1, exportedAt:new Date().toISOString(), settings, cases, referrers:[...S.refs.values()], tombstones:S.tombstones };
}
async function backupToFolder(){
  if(!FS.ok()){ FS.pending = true; renderStatus(); return false; }
  if(FS.busy){ FS.pending = true; return false; }
  FS.busy = true; FS.pending = false; renderStatus();
  try{
    for(const c of S.cases.values()) for(const im of c.images){
      const key = c.id + '-' + im.id; if(FS.written.has(key) || !im.data) continue;
      const parts = [DATA_DIR, 'Images', key + '.jpg'];
      if(!(await FS.exists(parts))) await FS.write(parts, dataURLtoBlob(im.data));
      FS.written.add(key);
    }
    const json = JSON.stringify(backupPayload(false));
    await FS.write([DATA_DIR, 'EndoLetter-data.json'], new Blob([json], { type:'application/json' }));
    await FS.write([DATA_DIR, 'Backups', `EndoLetter-backup-${todayISO()}.json`], new Blob([json], { type:'application/json' }));
    // keep 60 most recent daily snapshots
    const bd = await FS.dir([DATA_DIR, 'Backups']); const names = [];
    for await (const [name] of bd.entries()) if(/^EndoLetter-backup-\d{4}-\d\d-\d\d\.json$/.test(name)) names.push(name);
    names.sort(); for(const nm of names.slice(0, Math.max(0, names.length - 60))) await bd.removeEntry(nm);
    FS.lastBackup = Date.now(); FS.error = ''; await DB.put('kv', FS.lastBackup, 'lastBackup');
    return true;
  } catch(e){
    console.error(e); FS.error = e.message || String(e);
    if(e.name === 'NotAllowedError' || e.name === 'SecurityError') FS.perm = 'prompt';
    FS.pending = true; return false;
  } finally { FS.busy = false; renderStatus(); renderBanner(); if(FS.pending && FS.ok() && !FS.error) scheduleBackup(); }
}
const scheduleBackup = debounce(() => backupToFolder(), 2500);
function dataURLtoBlob(d){ const [h, b] = d.split(','); const mime = h.match(/:(.*?);/)[1]; const bin = atob(b); const a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type:mime }); }
function blobToDataURL(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }

// merge incoming backup into local data (newest wins; respects deletions)
async function mergeData(data, fromFolder){
  if(!data || data.app !== 'EndoLetter') throw new Error('This is not an EndoLetter backup file.');
  let added = 0, updated = 0;
  const tomb = new Map(S.tombstones.map(t => [t.id, t.at]));
  for(const t of data.tombstones || []) if(!tomb.has(t.id) || tomb.get(t.id) < t.at) tomb.set(t.id, t.at);
  for(const c of data.cases || []){
    if(tomb.has(c.id) && tomb.get(c.id) >= c.updatedAt) continue;
    const cur = S.cases.get(c.id);
    if(cur && cur.updatedAt >= c.updatedAt) continue;
    for(const im of c.images || []){
      if(!im.data && im.file && fromFolder){ try{ im.data = await blobToDataURL(await FS.read([DATA_DIR, ...im.file.split('/')])); } catch(e){ console.warn('missing image', im.file); } }
      delete im.file;
    }
    S.cases.set(c.id, c); await DB.put('cases', c); cur ? updated++ : added++;
  }
  for(const [id, at] of tomb){ const cur = S.cases.get(id); if(cur && cur.updatedAt <= at){ S.cases.delete(id); await DB.del('cases', id); } }
  S.tombstones = [...tomb].map(([id, at]) => ({ id, at })); await DB.put('kv', S.tombstones, 'tombstones');
  for(const r of data.referrers || []){ const cur = S.refs.get(r.id); if(!cur || (cur.updatedAt || 0) < (r.updatedAt || 0)){ S.refs.set(r.id, r); await DB.put('referrers', r); } }
  if(data.settings && (!S.settingsTouched || (data.settings.updatedAt || 0) > (S.settings.updatedAt || 0))){ S.settings = { ...DEFAULT_SETTINGS, ...data.settings }; await DB.put('kv', S.settings, 'settings'); }
  return { added, updated };
}
async function connectFolder(){
  try{
    await FS.pick();
  } catch(e){ if(e.name !== 'AbortError') toast('Could not open folder: ' + e.message, true); return; }
  try{
    if(await FS.exists([DATA_DIR, 'EndoLetter-data.json'])){
      const f = await FS.read([DATA_DIR, 'EndoLetter-data.json']);
      const r = await mergeData(JSON.parse(await f.text()), true);
      if(r.added || r.updated) toast(`Restored from folder: ${r.added} new, ${r.updated} updated case(s).`);
    }
  } catch(e){ toast('Folder backup could not be read: ' + e.message, true); }
  const ok = await backupToFolder();
  if(ok) toast(`Connected to folder "${FS.root.name}". Letters and backups will be saved there.`);
  renderAll();
}
async function reconnectFolder(){ if(await FS.reconnect()){ toast('Folder reconnected.'); await backupToFolder(); } else toast('Permission was not granted.', true); renderAll(); }

async function upsertReferrer(c){

/* ---------------- modal ---------------- */
function modal({ title, body, buttons = [], wide = false, onClose }){
  const root = $('#modal-root');
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><header><h3>${esc(title)}</h3><button class="btn sm" data-x>✕</button></header><div class="mb">${body}</div>${buttons.length ? `<footer>${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</footer>` : ''}</div>`;
  const close = () => { ov.remove(); onClose && onClose(); };
  ov.addEventListener('click', e => { if(e.target === ov || e.target.closest('[data-x]')) close(); const b = e.target.closest('footer [data-i]'); if(b){ const def = buttons[+b.dataset.i]; const r = def.onClick && def.onClick(ov); if(r !== false) close(); } });
  root.appendChild(ov); return { el:ov, close };
}
function ask(title, text, choices){ return new Promise(res => { modal({ title, body:`<p style="margin:0">${text}</p>`, buttons: choices.map(c => ({ label:c.label, cls:c.cls, onClick:() => res(c.value) })), onClose:() => res(null) }); }); }

/* ---------------- actions ---------------- */
function validateForLetter(c){
  const miss = [];
  if(!c.patient.last) miss.push('patient last name');
  if(!c.referrer.last) miss.push('referring dentist');
  if(!c.teeth.length) miss.push('at least one tooth');
  if(!S.settings.practiceName) miss.push('practice name (Settings)');
  return miss;
}
async function makePdfBlob(c){ c.letter.body = c.letter.edited ? $('#letter-body')?.value ?? c.letter.body : c.letter.body; return buildPDF(c); }
async function previewPdf(c, title){
  try{
    const blob = await makePdfBlob(c); const url = URL.createObjectURL(blob);
    modal({ title: title || 'Letter preview', wide:true, body:`<iframe src="${url}#view=FitH" title="PDF preview"></iframe>`, onClose:() => URL.revokeObjectURL(url),
      buttons: S.view === 'case' && c === cur() ? [{ label:'Close' }, { label:'Save letter PDF', cls:'primary', onClick:() => { savePdf(); } }] : [{ label:'Close' }] });
  } catch(e){ console.error(e); toast('Could not create PDF: ' + e.message, true); }
}
async function savePdf(){
  const c = cur(); if(!c) return;
  const miss = validateForLetter(c);
  if(miss.length){ const go = await ask('Some details are missing', `The letter is missing: <b>${esc(miss.join(', '))}</b>. Save it anyway?`, [{ label:'Go back', value:false }, { label:'Save anyway', cls:'primary', value:true }]); if(!go) return; }
  const haveFolder = FS.supported && FS.root ? await FS.ensure() : false;
  let blob; try{ blob = await makePdfBlob(c); } catch(e){ console.error(e); toast('Could not create PDF: ' + e.message, true); return; }
  let base = letterFileBase(c), pathStr;
  if(haveFolder){
    const folder = patientFolder(c);
    let parts = ['Letters', folder, base + '.pdf'];
    try{
      if(await FS.exists(parts)){
        const ch = await ask('A letter with this name already exists', `<code class="path">Letters/${esc(folder)}/${esc(base)}.pdf</code><br><br>Replace it with this version, or keep both?`, [{ label:'Cancel', value:null }, { label:'Keep both', value:'both' }, { label:'Replace', cls:'primary', value:'replace' }]);
        if(!ch) return;
        if(ch === 'both'){ let v = 2; while(await FS.exists(['Letters', folder, `${base} (v${v}).pdf`])) v++; base = `${base} (v${v})`; parts = ['Letters', folder, base + '.pdf']; }
      }
      await FS.write(parts, blob);
      if(S.settings.saveNote) await FS.write(['Letters', folder, base + ' - Chart note.txt'], new Blob([chartNote(c).replace(/\n/g, '\r\n')], { type:'text/plain' }));
      pathStr = `${FS.root.name}/Letters/${folder}/${base}.pdf`;
      toast('Letter saved to ' + pathStr);
    } catch(e){ console.error(e); toast('Could not write to the folder (' + e.message + '). Downloading instead.', true); download(blob, base + '.pdf'); pathStr = 'Downloads/' + base + '.pdf'; }
  } else {
    download(blob, base + '.pdf'); pathStr = 'Downloads/' + base + '.pdf';
    if(S.settings.saveNote) download(new Blob([chartNote(c).replace(/\n/g, '\r\n')], { type:'text/plain' }), base + ' - Chart note.txt');
    toast(FS.supported ? 'Downloaded. Choose a backup folder to have letters filed by patient automatically.' : 'Letter downloaded to your Downloads folder.');
  }
  c.savedFiles.push({ path:pathStr, at:Date.now() }); touch(c); upsertReferrer(c); S.draft = null;
  await persistCase.flush();
  renderView();
}
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
async function deleteCase(id){
  const c = S.cases.get(id); if(!c) return;
  const ok = await ask('Delete this case?', `<b>${esc(ptFile(c))}</b> · ${esc(fmtLong(c.procDate))}<br><br>This removes it from the app and from the folder backup. Letters already saved as PDF files are not deleted.`, [{ label:'Cancel', value:false }, { label:'Delete', cls:'primary', value:true }]);
  if(!ok) return;
  S.cases.delete(id); await DB.del('cases', id);
  S.tombstones.push({ id, at:Date.now() }); await DB.put('kv', S.tombstones, 'tombstones');
  if(FS.ok()) for(const im of c.images) await FS.remove([DATA_DIR, 'Images', `${c.id}-${im.id}.jpg`]);
  if(S.curId === id) S.curId = null;
  scheduleBackup(); renderView(); toast('Case deleted.');
}
function openCase(id){ S.curId = id; S.activeTooth = null; S.view = 'case'; S.sideTab = 'letter'; renderAll(); window.scrollTo(0, 0); }
function startNewCase(from){
  const c = newCase();
  if(from){ c.patient = clone(from.patient); c.referrer = clone(from.referrer); }
  S.cases.set(c.id, c); S.draft = c.id; S.curId = c.id; S.activeTooth = null; S.view = 'case'; S.sideTab = 'letter';
  renderAll(); window.scrollTo(0, 0);
}
async function addImages(files){
  const c = cur(); let n = 0;
  for(const f of files){ if(!f.type.startsWith('image/')) continue;
    try{ const r = await downscale(f, 1400); const caps = ['Pre-operative', 'Post-operative']; c.images.push({ id:uid(), data:r.data, w:r.w, h:r.h, caption: caps[c.images.length] || 'Radiograph', include:true }); n++; }
    catch(e){ toast('Could not read ' + f.name, true); } }
  if(n){ touch(c); renderView(); }
}

  const c = newCase();
