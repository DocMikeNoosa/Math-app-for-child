  Object.assign(c.referrer, { first:'Amy', last:'Lee', practice:'Lee Family Dentistry', address:'100 Main Street, Suite 2\nSpringfield, IL 62701' });
  const t = newTooth(30); Object.assign(t.history, { cc:'sharp pain on chewing for two weeks', spontaneous:false });
  Object.assign(t.tests, { cold:'nr', ept:'nr', perc:'tender', palp:'wnl', bite:'pain', probe:'3', mobility:'0' }); t.radio.findings = ['parl', 'deeprest'];
  Object.assign(t.tx, { obturation:'wv', sealer:'bioceramic', temp:'cavit', naoclConc:'5.25', irrigants:['naocl','edta','us'], anesthesia:'4% articaine with 1:100,000 epinephrine' });
  t.tx.canals.forEach((k, i) => k.wl = ['21.0','21.0','22.0'][i]);
  c.teeth.push(t);
  await previewPdf(c, 'Sample letter');
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-nav]'); if(nav){ S.view = nav.dataset.nav; if(S.view === 'case' && !cur()) S.curId = null; renderAll(); return; }
  const side = e.target.closest('[data-side]'); if(side){ S.sideTab = side.dataset.side; const c = cur(); $$('.stabs button').forEach(b => b.classList.toggle('on', b === side)); $('#side-body').innerHTML = S.sideTab === 'letter' ? letterTab(c) : `<pre class="note" id="note-pre"></pre>`; if(S.sideTab === 'letter' && c.letter.edited) $('#letter-body').value = c.letter.body; refreshDerived(); return; }
  const segb = e.target.closest('.seg button');
  if(segb){ const sg = segb.parentElement, path = sg.dataset.seg; setBound(path, segb.dataset.v); $$('button', sg).forEach(b => b.classList.toggle('on', b === segb)); if(sg.dataset.re) rerenderTooth(); return; }
  const tooth = e.target.closest('#odo-wrap g.t');
  if(tooth){ toggleTooth(+tooth.dataset.tooth); return; }
  const tab = e.target.closest('[data-tab]'); if(tab){ S.activeTooth = +tab.dataset.tab; $('#tooth-panel').innerHTML = renderToothPanel(); refreshDerived(); return; }
  const row = e.target.closest('tr[data-open]'); if(row && !e.target.closest('button')){ openCase(row.dataset.open); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act, c = cur();
  switch(act){
    case 'connect-folder': return connectFolder();
    case 'reconnect-folder': return reconnectFolder();
    case 'backup-now': { FS.error = ''; const ok = await backupToFolder(); if(ok) toast('Backup complete.'); return renderAll(); }
    case 'download-backup': download(new Blob([JSON.stringify(backupPayload(true))], { type:'application/json' }), `EndoLetter-backup-${todayISO()}.json`); await DB.put('kv', Date.now(), 'lastManual'); return toast('Backup file downloaded.');
    case 'import-backup': return $('#import-input').click();
    case 'new-case': return startNewCase();
    case 'followup': return startNewCase(S.cases.get(a.dataset.id));
    case 'del-case': return deleteCase(a.dataset.id);
    case 'remove-tooth': { const t = activeT(); const ok = await ask('Remove tooth?', `Remove tooth ${tRef(t.num)} and everything entered for it from this case?`, [{ label:'Cancel', value:false }, { label:'Remove', cls:'primary', value:true }]); if(!ok) return; c.teeth = c.teeth.filter(x => x !== t); S.activeTooth = null; touch(c); return renderView(); }
    case 'add-canal': { const t = activeT(); t.tx.canals.push({ name:a.dataset.name, wl:'', ref:'', maf:'' }); touch(c); return rerenderTooth(); }
    case 'del-canal': { const t = activeT(); t.tx.canals.splice(+a.dataset.i, 1); touch(c); return rerenderTooth(); }
    case 'regen': c.letter.edited = false; c.letter.body = ''; touch(c); $('#letter-body').value = letterBody(c); $('#letter-state').textContent = 'Updates automatically as you fill in the case'; a.disabled = true; return;
    case 'copy-note': try{ await navigator.clipboard.writeText(chartNote(c)); toast('Chart note copied to clipboard.'); } catch(err){ S.sideTab = 'note'; renderView(); toast('Clipboard blocked - select the note text and copy it manually.', true); } return;
    case 'preview-pdf': return previewPdf(c);
    case 'save-pdf': return savePdf();
    case 'add-img': return $('#img-input').click();
    case 'del-img': c.images = c.images.filter(i => i.id !== a.dataset.id); touch(c); return renderView();
    case 'edit-ref': return editRef(a.dataset.id);
    case 'del-ref': { const r = S.refs.get(a.dataset.id); const ok = await ask('Delete dentist?', `Remove <b>${esc([r.title, r.first, r.last].join(' '))}</b> from the address book? Existing cases keep their details.`, [{ label:'Cancel', value:false }, { label:'Delete', cls:'primary', value:true }]); if(!ok) return; S.refs.delete(r.id); await DB.del('referrers', r.id); scheduleBackup(); return renderView(); }
    case 'pick-asset': S.assetKey = a.dataset.k; return $('#asset-input').click();
    case 'clear-asset': S.settings[a.dataset.k] = ''; persistSettings(); return renderView();
    case 'sample-pdf': return sampleLetter();
  }
});
function setBound(path, v){
  const [root, ...rest] = path.split('.'); const p = rest.join('.');
  if(root === 's'){ setPath(S.settings, p, v); persistSettings(); if(p === 'numbering' || p === 'accent') { /* re-render elsewhere */ } return; }
  const c = cur(); const base = root === 'c' ? c : activeT(); setPath(base, p, v); touch(c); refreshDerived();
}
function rerenderTooth(){ const y = window.scrollY; $('#tooth-panel').innerHTML = renderToothPanel(); refreshDerived(); window.scrollTo(0, y); }
function toggleTooth(n){
  const c = cur(), ex = c.teeth.find(t => t.num === n);
  if(ex){ S.activeTooth = n; }
  else { c.teeth.push(newTooth(n)); c.teeth.sort((a, b) => a.num - b.num); S.activeTooth = n; touch(c); }
  $('#tooth-panel').innerHTML = renderToothPanel(); refreshDerived();
}
document.addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'search'){ S.search = el.value; const pos = el.selectionStart; renderView(); const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos); return; }
  if(el.id === 'letter-body'){ const c = cur(); c.letter.body = el.value; if(!c.letter.edited){ c.letter.edited = true; $('#letter-state').textContent = 'Edited by you - automatic updates paused'; $('[data-act=regen]').disabled = false; } touch(c); return; }
  if(el.id === 'sal'){ const c = cur(); c.letter.salutation = el.value; c.letter.edSal = true; touch(c); return; }
  if(el.dataset.img){ const c = cur(); const im = c.images.find(i => i.id === el.dataset.img); if(el.dataset.k === 'caption') im.caption = el.value; touch(c); return; }
  if(el.dataset.b && el.type !== 'checkbox' && el.tagName !== 'SELECT'){ setBound(el.dataset.b, el.value); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if(el.dataset.actChange === 'pick-ref'){ const r = S.refs.get(el.value); if(r){ const c = cur(); c.referrer = { title:r.title || 'Dr.', first:r.first || '', last:r.last || '', practice:r.practice || '', address:r.address || '', phone:r.phone || '', email:r.email || '' }; touch(c); const y = scrollY; renderView(); scrollTo(0, y); } return; }
  if(el.dataset.img && el.type === 'checkbox'){ const c = cur(); const im = c.images.find(i => i.id === el.dataset.img); im.include = el.checked; touch(c); return; }
  if(el.dataset.arr){ const path = el.dataset.arr; const arr = [...(val(path) || [])]; const i = arr.indexOf(el.value); if(el.checked && i < 0) arr.push(el.value); if(!el.checked && i >= 0) arr.splice(i, 1); setBound(path, arr); if(path === 't.tx.irrigants') rerenderTooth(); return; }
  if(el.dataset.b && el.type === 'checkbox'){ setBound(el.dataset.b, el.checked); if(el.dataset.b.startsWith('s.')) renderView(); return; }
  if(el.dataset.b && el.tagName === 'SELECT'){ setBound(el.dataset.b, el.value); if(el.dataset.re) rerenderTooth(); if(el.dataset.b.startsWith('s.')) renderView(); return; }
  if(el.dataset.b && el.type === 'color'){ setBound(el.dataset.b, el.value); return; }
  if(el.dataset.b && el.dataset.b.startsWith('c.') && (el.type === 'date')) { refreshDerived(); return; }
  if(el.id === 'img-input'){ await addImages([...el.files]); el.value = ''; return; }
  if(el.id === 'asset-input'){ const f = el.files[0]; el.value = ''; if(!f) return; try{ const r = await downscale(f, 900, 'image/png'); S.settings[S.assetKey] = r.data; persistSettings(); renderView(); } catch(err){ toast('Could not read image.', true); } return; }
  if(el.id === 'import-input'){ const f = el.files[0]; el.value = ''; if(!f) return; try{ const r = await mergeData(JSON.parse(await f.text()), false); toast(`Restore complete: ${r.added} new, ${r.updated} updated case(s).`); scheduleBackup(); renderAll(); } catch(err){ toast('Restore failed: ' + err.message, true); } return; }
});
// drag & drop radiographs
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.remove('over'); addImages([...e.dataTransfer.files]); } else if(e.dataTransfer && e.dataTransfer.files.length) e.preventDefault(); });
window.addEventListener('beforeunload', () => { persistCase.flush(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && FS.ok()) scheduleBackup.flush(); });

function editRef(id){
  const r = id ? clone(S.refs.get(id)) : { id:uid(), title:'Dr.', first:'', last:'', practice:'', address:'', phone:'', email:'' };
  const f = (k, l, area) => `<label class="f">${l}${area ? `<textarea data-r="${k}" rows="2">${esc(r[k] || '')}</textarea>` : `<input type="text" data-r="${k}" value="${esc(r[k] || '')}">`}</label>`;
  modal({ title: id ? 'Edit dentist' : 'Add dentist', body:`<div class="grid g3">${f('title', 'Title')}${f('first', 'First name')}${f('last', 'Last name')}</div><div class="grid g2" style="margin-top:10px">${f('practice', 'Practice')}${f('phone', 'Phone')}${f('email', 'Email')}</div><div style="margin-top:10px">${f('address', 'Address', true)}</div>`,
    buttons:[{ label:'Cancel' }, { label:'Save', cls:'primary', onClick:(ov) => { $$('[data-r]', ov).forEach(i => r[i.dataset.r] = i.value.trim()); if(!r.last){ toast('Last name is required.', true); return false; } r.updatedAt = Date.now(); S.refs.set(r.id, r); DB.put('referrers', r); scheduleBackup(); renderView(); } }] });
}

/* ---------------- boot ---------------- */
(async function boot(){
  try{
    await DB.open();
    const st = await DB.get('kv', 'settings'); if(st){ S.settings = { ...DEFAULT_SETTINGS, ...st }; S.settingsTouched = true; }
    for(const c of await DB.all('cases')) S.cases.set(c.id, c);
    for(const r of await DB.all('referrers')) S.refs.set(r.id, r);
    S.tombstones = (await DB.get('kv', 'tombstones')) || [];
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if(FS.supported) await FS.init();
  } catch(e){ console.error(e); document.body.insertAdjacentHTML('afterbegin', `<div class="banner warn">Storage could not be opened (${esc(e.message)}). Make sure you are not in a private/incognito window.</div>`); }
  renderAll();
  if(FS.ok()) backupToFolder();
})();
</script>
</body>
