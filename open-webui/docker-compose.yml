# Open WebUI + Ollama, fully local and open source.
# Usage: ./setup.sh   (picks models for your hardware; see README.md)
name: open-webui

services:
  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot job: downloads the models listed in MODELS, then exits.
  model-puller:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    container_name: ollama-model-puller
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODELS=${MODELS:-gpt-oss:20b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        failed=""
        for m in $$(echo "$$MODELS" | tr ',' ' '); do
          echo ">>> pulling $$m"
          ollama pull "$$m" || failed="$$failed $$m"
        done
        echo ">>> installed models:"
        ollama list
        if [ -n "$$failed" ]; then echo ">>> FAILED to pull:$$failed"; exit 1; fi
    restart: "no"

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_TAG:-main}
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - DEFAULT_MODELS=${DEFAULT_MODEL:-gpt-oss:20b}
      - ENABLE_OPENAI_API=false
      # Voice input: local Whisper speech-to-text (runs inside this container, offline).
      - AUDIO_STT_ENGINE=
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - open-webui:/app/backend/data

  # ---- Pictures & video (optional): ./setup.ps1 -Images  /  ./setup.sh --images ----
  comfyui:
    image: yanwk/comfyui-boot:${COMFY_TAG:-cpu}
    container_name: comfyui
    profiles: ["images"]
    restart: unless-stopped
    ports:
      - "${COMFY_PORT:-8188}:8188"
    environment:
      # IPv4 listen works on every Docker setup (IPv6-only bind fails on some).
      - CLI_ARGS=${COMFY_ARGS:---cpu --listen 0.0.0.0}
    volumes:
      - comfyui:/root
      - ./pictures:/root/ComfyUI/output

  # One-shot job run before ComfyUI starts: when the ComfyUI image changes (e.g. a newer CUDA
  # build), refresh the program files copied into the volume. Models, workflows and pictures stay.
  comfyui-prepare:
    image: yanwk/comfyui-boot:${COMFY_TAG:-cpu}
    container_name: comfyui-prepare
    profiles: ["images"]
    environment:
      - COMFY_IMAGE=yanwk/comfyui-boot:${COMFY_TAG:-cpu}
    volumes:
      - comfyui:/root
      - ./pictures:/root/ComfyUI/output
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        have=$$(cat /root/.comfy-image 2>/dev/null || echo none)
        if [ -f /root/ComfyUI/main.py ] && [ "$$have" != "$$COMFY_IMAGE" ]; then
          echo ">>> updating ComfyUI program files for $$COMFY_IMAGE (models, workflows and pictures are kept)"
          cd /root/ComfyUI || exit 1
          for f in * .[!.]*; do
            case "$$f" in models|user|output|input|'*'|'.[!.]*') ;; *) rm -rf -- "$$f" ;; esac
          done
          rm -rf /root/.local
        fi
        echo "$$COMFY_IMAGE" > /root/.comfy-image
    restart: "no"

  # One-shot job: downloads picture/video models (official links from ComfyUI's
  # own templates) and adds ready-to-use workflows to the Workflows sidebar.
  comfyui-models:
    image: yanwk/comfyui-boot:${COMFY_TAG:-cpu}
    container_name: comfyui-models
    profiles: ["images"]
    environment:
      - COMFY_DOWNLOADS=${COMFY_DOWNLOADS:-}
      - COMFY_WORKFLOWS=${COMFY_WORKFLOWS:-}
    volumes:
      - comfyui:/root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -u
        # Wait until the comfyui container has unpacked ComfyUI into the volume.
        for i in $$(seq 1 300); do [ -f /root/ComfyUI/main.py ] && break; sleep 2; done
        failed=""
        for item in $$COMFY_DOWNLOADS; do
          dir=$${item%%|*}; url=$${item#*|}; name=$${url##*/}
          dest=/root/ComfyUI/models/$$dir/$$name
          mkdir -p "$$(dirname "$$dest")"
          if [ -s "$$dest" ]; then echo ">>> already have $$name"; continue; fi
          echo ">>> downloading $$name"
          if curl -fL --retry 5 --retry-delay 5 -C - -o "$$dest.part" "$$url"; then
            mv "$$dest.part" "$$dest"
          else
            failed="$$failed $$name"
          fi
        done
        # Newer images run ComfyUI on python3.13 while plain python3 may be an older system Python.
        py=$$(command -v python3.13 || command -v python3)
        tpl=$$($$py -c 'import comfyui_workflow_templates_json as m,os;print(os.path.dirname(m.__file__)+"/templates")')
        wf=/root/ComfyUI/user/default/workflows
        mkdir -p "$$wf"
        for item in $$COMFY_WORKFLOWS; do
          src=$${item%%|*}; title=$${item#*|}
          cp "$$tpl/$$src.json" "$$wf/$${title//_/ }.json" && echo ">>> added workflow: $${title//_/ }"
        done
        if [ -n "$$failed" ]; then echo ">>> FAILED to download:$$failed"; exit 1; fi
        echo ">>> picture/video models ready"
    restart: "no"

volumes:
  ollama:
  open-webui:
  comfyui:
