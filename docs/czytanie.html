* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --hotpink: #ff5ca8;
  --hotpink-deep: #f2308f;
  --lilac: #b388ff;
  --lilac-deep: #9b6bf2;
  --aqua: #3fd9d0;
  --sunny: #ffd54d;
  --sunny-deep: #ffb81a;
  --plum: #4a2364;
  --plum-soft: #8a6fae;
  --blush: #ffe3f1;
  --lavender: #ebdcff;
  --paper: #fffdf6;
  --candy-grad: linear-gradient(135deg, var(--hotpink), var(--lilac-deep));
  --mint-grad: linear-gradient(135deg, #38d9a9, var(--aqua));
  --sky-grad: linear-gradient(135deg, #62c5ff, var(--lilac));
  --gold-grad: linear-gradient(135deg, #ffe066, var(--sunny-deep));
  --pink-shadow: 0 10px 24px rgba(255, 92, 168, .35);
  --gloss: inset 0 2px 0 rgba(255, 255, 255, .65), inset 0 -3px 0 rgba(120, 40, 120, .12);
  --radius: 28px;
  --spring: cubic-bezier(.34, 1.7, .5, 1);
  --read-size: 20px;
}

html, body {
  margin: 0; padding: 0; min-height: 100%;
  font-family: "Baloo 2", -apple-system, "Segoe UI", system-ui, sans-serif;
  color: var(--plum);
  background:
    radial-gradient(120% 90% at 15% 0%, var(--blush) 0%, rgba(255, 227, 241, 0) 60%),
    radial-gradient(120% 100% at 100% 20%, var(--lavender) 0%, rgba(235, 220, 255, 0) 65%),
    linear-gradient(160deg, #ffe9f4 0%, #efdffe 48%, #d9f7f4 100%);
  background-attachment: fixed;
  overscroll-behavior: none;
}
body { user-select: none; -webkit-user-select: none; }

#decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#decor span { position: absolute; opacity: .45;
  animation: floaty 9s ease-in-out infinite alternate, drift 17s ease-in-out infinite alternate; }
@keyframes floaty { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-30px) rotate(9deg) scale(1.1); } }
@keyframes drift { from { margin-left: 0; } to { margin-left: 24px; } }
@keyframes screenIn { from { opacity: 0; transform: translateY(26px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) {
  #decor span, .badge-pop, .map-node.current::after { animation: none !important; }
  #app { animation: none !important; }
}

#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100dvh;
  display: flex; flex-direction: column;
  padding: calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }

#confetti { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 90; }

h1 { font-size: 32px; font-weight: 800; line-height: 1.12; text-align: center; margin: 10px 0;
  background: linear-gradient(120deg, var(--hotpink-deep), var(--lilac-deep));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { text-align: center; color: var(--plum-soft); font-weight: 700; margin: 0 0 8px; }

button { font-family: inherit; border: none; cursor: pointer; color: inherit; background: none; padding: 0; }
.squishy { transition: transform .22s var(--spring); }
.squishy:active { transform: scale(.9); transition-duration: .08s; }

.big-btn { display: block; width: 100%; min-height: 62px; border-radius: 999px;
  font-size: 23px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(120, 20, 90, .25);
  background: var(--candy-grad); box-shadow: var(--pink-shadow), var(--gloss); margin: 10px 0; }
.big-btn.mint { background: var(--mint-grad); box-shadow: 0 10px 24px rgba(56, 217, 169, .4), var(--gloss); }
.big-btn.sky { background: var(--sky-grad); box-shadow: 0 10px 24px rgba(98, 197, 255, .4), var(--gloss); }
.big-btn:disabled { background: linear-gradient(135deg, #d9cfe8, #cfc4e2); box-shadow: none; }

.card { background: linear-gradient(165deg, rgba(255,255,255,.94), rgba(255,255,255,.7));
  border-radius: var(--radius); padding: 15px; margin: 10px 0;
  box-shadow: 0 6px 20px rgba(179, 136, 255, .18), inset 0 2px 0 rgba(255,255,255,.9); }

.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 8px; }
.back-btn { font-size: 27px; font-weight: 800; color: var(--lilac-deep); padding: 6px 14px 6px 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.85);
  border-radius: 999px; padding: 5px 13px; font-size: 16px; font-weight: 800; color: var(--plum);
  box-shadow: 0 4px 12px rgba(179,136,255,.25), inset 0 2px 0 rgba(255,255,255,.9); }
.pill .pts { color: #a06b00; }

/* ---------------- home ---------------- */
.mode-card { position: relative; width: 100%; border-radius: var(--radius); padding: 20px 16px;
  text-align: center; margin: 8px 0; border: 4px solid transparent;
  background: linear-gradient(160deg, rgba(255,255,255,.94), rgba(255,255,255,.66));
  box-shadow: 0 8px 22px rgba(179,136,255,.24), inset 0 2px 0 rgba(255,255,255,.9); }
.mode-card .flag { font-size: 52px; display: block; }
.mode-card .mname { font-size: 25px; font-weight: 800; color: var(--plum); }
.mode-card .mdesc { font-size: 15px; font-weight: 700; color: var(--plum-soft); }
.mode-card .mprog { margin-top: 8px; font-size: 14px; font-weight: 800; color: var(--hotpink-deep); }

/* ---------------- map ---------------- */
.map-wrap { position: relative; margin: 6px 0; }
.map-path { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; }
.map-nodes { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; }
.map-node { display: flex; align-items: center; gap: 12px; width: 78%; border-radius: 22px;
  padding: 10px 14px; text-align: left;
  background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(255,255,255,.72));
  box-shadow: 0 6px 16px rgba(179,136,255,.22), inset 0 2px 0 rgba(255,255,255,.9); }
.map-node:nth-child(even) { align-self: flex-end; }
.map-node .num { flex: 0 0 46px; height: 46px; border-radius: 50%; font-size: 21px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; color: #fff;
  background: var(--candy-grad); box-shadow: var(--gloss); }
.map-node.locked { opacity: .55; filter: grayscale(.6); }
.map-node.locked .num { background: linear-gradient(135deg, #c5bad6, #a99cc2); }
.map-node.done .num { background: var(--mint-grad); }
.map-node.current { border: 3px solid var(--hotpink); }
.map-node.current::after { content: "✨"; position: absolute; margin-left: -14px; margin-top: -34px;
  animation: floaty 2s ease-in-out infinite alternate; }
.map-node .mt { font-size: 16.5px; font-weight: 800; color: var(--plum); line-height: 1.15; }
.map-node .ms { font-size: 15px; letter-spacing: 1px; }
.map-node .ms .on { color: var(--sunny-deep); }
.map-node .ms .off { color: #d8cbee; }
.bonus-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bonus-card { border-radius: 20px; padding: 12px 6px; text-align: center; font-weight: 800; font-size: 13.5px;
  color: var(--plum); background: linear-gradient(160deg, #fffbe8, #fff0c2);
  box-shadow: 0 5px 14px rgba(255,184,26,.3), inset 0 2px 0 rgba(255,255,255,.9); }
.bonus-card .be { font-size: 30px; display: block; }
.badge-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.badge-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 6px 12px;
  font-size: 13px; font-weight: 800; background: linear-gradient(160deg, #e2fbf0, #c9f6e4); color: #0f7a55;
  box-shadow: 0 3px 8px rgba(56,217,169,.3); }
.badge-chip.locked { background: rgba(255,255,255,.6); color: #9a93ab; filter: grayscale(1); }

/* ---------------- reading ---------------- */
.read-card { background: var(--paper); border-radius: var(--radius); padding: 20px 18px; margin: 8px 0;
  box-shadow: 0 8px 24px rgba(179,136,255,.22), inset 0 2px 0 rgba(255,255,255,.95); }
.read-title { font-size: 24px; font-weight: 800; color: var(--hotpink-deep); margin: 0 0 4px; }
.read-kicker { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--plum-soft); }
.read-text { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  font-size: var(--read-size); line-height: 1.75; color: #3b2b52; user-select: text; -webkit-user-select: text; }
.read-text p { margin: 0 0 1em; }
.read-text .vocab { display: inline; font-family: inherit; font-size: inherit; font-weight: 700; color: var(--lilac-deep);
  border-bottom: 2.5px dotted var(--hotpink); border-radius: 4px; padding: 0 1px; cursor: pointer; }
.read-text .vocab.known { color: #0f7a55; border-bottom-color: var(--aqua); }
.size-ctrl { display: inline-flex; gap: 6px; }
.size-ctrl button { width: 42px; height: 42px; border-radius: 50%; font-weight: 800; font-size: 16px;
  background: rgba(255,255,255,.85); color: var(--lilac-deep); box-shadow: 0 3px 8px rgba(179,136,255,.25); }
.poem { text-align: center; font-style: italic; }

/* ---------------- quiz ---------------- */
.q-prog { display: flex; gap: 6px; margin: 6px 0; }
.q-prog i { flex: 1; height: 8px; border-radius: 4px; background: #e5dcf5; }
.q-prog i.done { background: var(--mint-grad); }
.q-prog i.now { background: var(--candy-grad); }
.q-tag { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
  color: #fff; background: var(--sky-grad); border-radius: 999px; padding: 4px 12px; margin-bottom: 6px; }
.q-text { font-size: 21px; font-weight: 800; color: var(--plum); margin: 4px 0 12px; line-height: 1.3; }
.opt { display: block; width: 100%; text-align: left; border-radius: 18px; padding: 13px 15px; margin: 8px 0;
  font-size: 17.5px; font-weight: 700; color: var(--plum);
  background: linear-gradient(160deg, rgba(255,255,255,.96), rgba(255,255,255,.75));
  border: 3px solid transparent; box-shadow: 0 4px 12px rgba(179,136,255,.18); min-height: 54px; }
.opt.good { border-color: #2fae7d; background: linear-gradient(160deg, #e2fbf0, #c9f6e4); }
.opt.bad { border-color: #ff8c66; background: linear-gradient(160deg, #fff0eb, #ffe3da); opacity: .7; animation: shake .4s ease; }
.opt:disabled { cursor: default; }
.hint-bubble { background: linear-gradient(160deg, #fffbe8, #fff3c7); border-radius: 16px; padding: 10px 14px;
  font-size: 15.5px; font-weight: 700; color: var(--plum); margin: 8px 0; animation: pop .35s var(--spring);
  box-shadow: 0 4px 12px rgba(255,184,26,.25); }
.order-strip { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; margin: 8px 0; padding: 8px;
  border-radius: 16px; background: rgba(255,255,255,.6); border: 2px dashed var(--lilac); }
.order-strip .chip-done { background: var(--mint-grad); color: #fff; border-radius: 999px;
  padding: 7px 12px; font-size: 14.5px; font-weight: 800; }
.praise-line { text-align: center; font-size: 21px; font-weight: 800; margin: 8px 0;
  background: linear-gradient(120deg, #16b47f, var(--aqua));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: pop .4s var(--spring); }

/* ---------------- treasury ---------------- */
.word-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.word-card { border-radius: 18px; padding: 10px 12px; background: linear-gradient(160deg, #fffbe8, #fff0c2);
  box-shadow: 0 4px 12px rgba(255,184,26,.25); }
.word-card .w { font-size: 17px; font-weight: 800; color: var(--hotpink-deep); }
.word-card .d { font-size: 13px; font-weight: 600; color: #6b5a37; }

/* ---------------- overlays ---------------- */
#overlay:empty { display: none; }
.overlay-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(90, 40, 120, .4);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 18px; }
.sheet { background: linear-gradient(175deg, #fff8fc, #f4ecff 70%, #ecf9f7); width: 100%; max-width: 460px;
  max-height: 88dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  border-radius: 30px; padding: 18px; box-shadow: 0 18px 50px rgba(60,25,95,.4); animation: pop .35s var(--spring); }
.word-pop .w { font-size: 30px; font-weight: 800; color: var(--hotpink-deep); text-align: center; }
.word-pop .tr { text-align: center; font-size: 18px; font-weight: 800; color: var(--lilac-deep); }
.word-pop .d { font-size: 17.5px; font-weight: 700; color: var(--plum); text-align: center; margin: 10px 0; }
.word-pop .ex { font-family: Georgia, serif; font-style: italic; font-size: 16px; color: #6b5a80;
  background: rgba(255,255,255,.8); border-radius: 14px; padding: 10px 12px; text-align: center; }
.celebrate { text-align: center; }
.celebrate .big { font-size: 66px; animation: pop .5s var(--spring); }
.celebrate .stars-big { font-size: 42px; letter-spacing: 6px; }
.celebrate .stars-big .on { color: var(--sunny-deep); text-shadow: 0 0 14px rgba(255,213,77,.9); }
.celebrate .stars-big .off { color: #d8cbee; }

#toast { position: fixed; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(24px); z-index: 96; max-width: 88vw;
  background: linear-gradient(160deg, #5a2f86, #46216e); color: #fff; font-weight: 700; font-size: 15px;
  text-align: center; padding: 12px 20px; border-radius: 999px;
  box-shadow: 0 10px 28px rgba(60,25,95,.45), inset 0 2px 0 rgba(255,255,255,.25);
  opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .3s var(--spring); }
#toast.show { opacity: 1; transform: translateX(-50%); }
.small-note { font-size: 13.5px; color: var(--plum-soft); text-align: center; font-weight: 700; margin: 8px 0; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }
</style>
</head>
<body>
<div id="decor" aria-hidden="true"></div>
<main id="app" aria-live="polite"></main>
<div id="toast" role="status"></div>
<div id="overlay"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
"use strict";
/* ============================ engine ============================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- persistence (per language mode) ---------- */
function defaultState() {
  return { points: 0, stars: {}, done: [], words: [], badges: [], perfect: [], readSize: 20 };
}
function loadState(mode) {
  try {
    const raw = localStorage.getItem("tosia-czytanka-v1-" + mode);
    return raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  } catch (e) { return defaultState(); }
}
function saveState() {
  if (!ui.mode) return;
  try { localStorage.setItem("tosia-czytanka-v1-" + ui.mode, JSON.stringify(state)); } catch (e) {}
}

/* ---------- ui state ---------- */
const ui = {
  mode: null,          // "pl" | "en"
  screen: "home",      // home | map | read | quiz | treasury
  chapter: null,       // index into story chapters, or "b0","b1","b2" for bonus
  quiz: null,          // {qs, i, firstTry, correctFirst, hint, order:[], praise}
  wordPop: null,
  celebration: null,
  wordQuiz: null,      // {rounds, i, score, current}
};
let state = defaultState();

/* ---------- i18n helper: t(pl, en) follows the ACTIVE MODE ---------- */
const t = (pl, en) => (ui.mode === "en" ? en : pl);

/* ---------- toast ---------- */
let toastTimer = null;
function showToast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ---------- confetti (same engine family as the math app) ---------- */
const confetti = (() => {
  const canvas = $("#confetti"), cx = canvas.getContext("2d");
  let particles = [], running = false;
  const COLORS = ["#ff5ca8", "#9b6bf2", "#62c5ff", "#ffd54d", "#38d9a9", "#ff8c66", "#ffb81a"];
  function resize() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
  addEventListener("resize", resize); resize();
  function burst(n) {
    const now = performance.now();
    for (let i = 0; i < n; i++) particles.push({
      born: now, x: (0.2 + Math.random() * 0.6) * canvas.width, y: (0.1 + Math.random() * 0.2) * canvas.height,
      vx: (Math.random() - 0.5) * 300 * devicePixelRatio, vy: (-240 + Math.random() * 180) * devicePixelRatio,
      c: COLORS[(Math.random() * COLORS.length) | 0], s: (7 + Math.random() * 9) * devicePixelRatio,
      spin: (Math.random() - 0.5) * 12, star: Math.random() < 0.5,
    });
    if (!running) { running = true; requestAnimationFrame(frame); }
  }
  function star(c2, r) {
    c2.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.45 : r;
      c2[i ? "lineTo" : "moveTo"](Math.cos(a) * rad, Math.sin(a) * rad);
    }
    c2.closePath();
  }
  function frame(now) {
    cx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter((p) => now - p.born < 3000);
    if (!particles.length) { running = false; return; }
    for (const p of particles) {
      const dt = (now - p.born) / 1000;
      cx.save();
      cx.translate(p.x + p.vx * dt, p.y + p.vy * dt + 430 * devicePixelRatio * dt * dt);
      cx.rotate(p.spin * dt);
      cx.globalAlpha = Math.max(0, 1 - dt / 2.8);
      cx.fillStyle = p.c;
      if (p.star) { star(cx, p.s / 2); cx.fill(); } else cx.fillRect(-p.s / 2, -p.s * 0.3, p.s, p.s * 0.6);
      cx.restore();
    }
    requestAnimationFrame(frame);
  }
  return { burst };
})();

/* ---------- sounds: tiny WebAudio chimes (math-app family) ---------- */
const sfx = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state !== "running") { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  for (const evt of ["pointerdown", "touchend", "click"]) document.addEventListener(evt, ensure, { passive: true });
  function play(ms, step, dur, gain) {
    const ac = ensure(); if (!ac) return;
    const t0 = ac.currentTime + 0.02;
    ms.forEach((m, i) => {
      const g = ac.createGain(); g.connect(ac.destination);
      g.gain.setValueAtTime(0, t0 + i * step);
      g.gain.linearRampToValueAtTime(gain, t0 + i * step + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + i * step + dur);
      const o = ac.createOscillator(); o.type = "sine";
      o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
      o.connect(g); o.start(t0 + i * step); o.stop(t0 + i * step + dur + 0.05);
    });
  }
  return {
    good: () => play([84, 88, 91], 0.085, 0.22, 0.22),
    soft: () => play([67, 64], 0.16, 0.28, 0.1),
    word: () => play([83, 88], 0.08, 0.4, 0.2),
    fanfare: () => play([72, 76, 79, 84, 83, 84, 88], 0.12, 0.3, 0.22),
  };
})();

/* ---------- data access ---------- */
function content() { return ui.mode === "en" ? DATA_EN : DATA_PL; }
function chapterData(id) {
  const c = content();
  return typeof id === "string" ? c.bonus[+id.slice(1)] : c.chapters[id];
}
function isBonus(id) { return typeof id === "string"; }
function chapterKey(id) { return isBonus(id) ? id : "c" + id; }
function unlockedUpTo() { // first not-done story chapter index
  const c = content();
  for (let i = 0; i < c.chapters.length; i++) if (!state.done.includes("c" + i)) return i;
  return c.chapters.length;
}

/* ---------- badges ---------- */
function badgeDefs() {
  return [
    { id: "first", e: "📖", n: t("Czytelniczka", "Reader"), need: t("Ukończ 1. rozdział", "Finish chapter 1") },
    { id: "three", e: "🔖", n: t("Pilna czytelniczka", "Keen reader"), need: t("Ukończ 3 rozdziały", "Finish 3 chapters") },
    { id: "worm", e: "🐛", n: t("Mól książkowy", "Bookworm"), need: t("Ukończ 6 rozdziałów", "Finish 6 chapters") },
    { id: "master", e: "👑", n: t("Mistrzyni opowieści", "Story master"), need: t("Ukończ całą opowieść", "Finish the whole story") },
    { id: "hunter", e: "🦋", n: t("Łowczyni słów", "Word hunter"), need: t("Zbierz 10 słówek", "Collect 10 words") },
    { id: "perfect", e: "💎", n: t("Perfekcyjnie!", "Perfect!"), need: t("Rozdział bez błędu", "A flawless chapter") },
    { id: "stars20", e: "🌟", n: t("Gwiazdozbiór", "Constellation"), need: t("Zdobądź 20 gwiazdek", "Earn 20 stars") },
    { id: "explorer", e: "🗺️", n: t("Odkrywczyni", "Explorer"), need: t("Przeczytaj wszystkie niespodzianki", "Read every bonus text") },
  ];
}
function checkBadges() {
  const doneStory = state.done.filter((k) => k.startsWith("c")).length;
  const doneBonus = state.done.filter((k) => k.startsWith("b")).length;
  const totalStars = Object.values(state.stars).reduce((a, b) => a + b, 0);
  const earned = {
    first: doneStory >= 1, three: doneStory >= 3, worm: doneStory >= 6,
    master: doneStory >= content().chapters.length,
    hunter: state.words.length >= 10, perfect: state.perfect.length >= 1,
    stars20: totalStars >= 20, explorer: doneBonus >= content().bonus.length,
  };
  for (const b of badgeDefs()) {
    if (earned[b.id] && !state.badges.includes(b.id)) {
      state.badges.push(b.id);
      showToast(`${b.e} ${t("Nowa odznaka:", "New badge:")} ${b.n}!`);
      confetti.burst(30);
    }
  }
  saveState();
}

/* ============================ render ============================ */
let lastScreen = null;
function render() {
  const app = $("#app");
  const key = ui.mode + "/" + ui.screen + "/" + ui.chapter;
  if (key !== lastScreen) {
    lastScreen = key;
    app.style.animation = "none"; void app.offsetWidth;
    app.style.animation = "screenIn .5s cubic-bezier(.22, 1.4, .36, 1)";
  }
  switch (ui.screen) {
    case "home": app.innerHTML = renderHome(); break;
    case "map": app.innerHTML = renderMap(); break;
    case "read": app.innerHTML = renderRead(); break;
    case "quiz": app.innerHTML = renderQuiz(); break;
    case "treasury": app.innerHTML = renderTreasury(); break;
  }
  const ov = $("#overlay");
  if (ui.wordPop) ov.innerHTML = renderWordPop();
  else if (ui.celebration) ov.innerHTML = renderCelebration();
  else if (ui.wordQuiz) ov.innerHTML = renderWordQuiz();
  else ov.innerHTML = "";
}

/* ---------------- home ---------------- */
function renderHome() {
  const pl = loadState("pl"), en = loadState("en");
  const plDone = pl.done.filter((k) => k.startsWith("c")).length;
  const enDone = en.done.filter((k) => k.startsWith("c")).length;
  return `
    <div style="margin:auto 0">
      <div style="text-align:center;font-size:54px">📚✨</div>
      <h1>Czytanka Tosi</h1>
      <p class="subtitle">Wybierz opowieść · Choose your story</p>
      <button class="mode-card squishy" data-action="pick-mode" data-mode="pl">
        <span class="flag">🇵🇱</span>
        <span class="mname">Ola i tajemnica starej latarni</span><br>
        <span class="mdesc">opowieść po polsku · 12 rozdziałów</span>
        <div class="mprog">${plDone ? `⭐ ${plDone}/12 rozdziałów · ${pl.points} pkt` : "Zacznij przygodę!"}</div>
      </button>
      <button class="mode-card squishy" data-action="pick-mode" data-mode="en">
        <span class="flag">🇬🇧</span>
        <span class="mname">Max the Little Dragon</span><br>
        <span class="mdesc">a story in English · 12 chapters</span>
        <div class="mprog">${enDone ? `⭐ ${enDone}/12 chapters · ${en.points} pts` : "Start the adventure!"}</div>
      </button>
      <p class="small-note">Postępy zapisują się same · Progress saves automatically</p>
    </div>`;
}

/* ---------------- map ---------------- */
function starsHtml(n, max = 3) {
  let out = "";
  for (let i = 0; i < max; i++) out += `<span class="${i < n ? "on" : "off"}">★</span>`;
  return out;
}
function renderMap() {
  const c = content();
  const next = unlockedUpTo();
  const totalStars = Object.values(state.stars).reduce((a, b) => a + b, 0);
  const nodes = c.chapters.map((ch, i) => {
    const key = "c" + i;
    const done = state.done.includes(key);
    const locked = i > next;
    const cls = done ? "done" : (i === next ? "current" : (locked ? "locked" : ""));
    return `
      <button class="map-node squishy ${cls}" data-action="open-chapter" data-ch="${i}" ${locked ? "disabled" : ""}>
        <span class="num">${done ? "✓" : (locked ? "🔒" : i + 1)}</span>
        <span><span class="mt">${esc(ch.title)}</span><br>
        <span class="ms">${done ? starsHtml(state.stars[key] || 0) : (locked ? "" : t("Czytaj! →", "Read! →"))}</span></span>
      </button>`;
  }).join("");
  const bonus = c.bonus.map((b, i) => {
    const done = state.done.includes("b" + i);
    return `<button class="bonus-card squishy" data-action="open-chapter" data-ch="b${i}">
      <span class="be">${b.emoji}</span>${esc(b.short)}${done ? " ✓" : ""}</button>`;
  }).join("");
  const badges = badgeDefs().map((b) => {
    const got = state.badges.includes(b.id);
    return `<span class="badge-chip ${got ? "" : "locked"}" title="${esc(b.need)}">${b.e} ${esc(b.n)}</span>`;
  }).join("");
  return `
    <div class="topbar">
      <button class="back-btn squishy" data-action="go-home">←</button>
      <span class="pill">⭐ ${totalStars}</span>
      <span class="pill"><span class="pts">🏅 ${state.points} ${t("pkt", "pts")}</span></span>
    </div>
    <h1 style="font-size:26px">${esc(c.title)}</h1>
    <div class="map-wrap"><div class="map-nodes">${nodes}</div></div>
    <div class="card">
      <b>🎁 ${t("Półka z niespodziankami", "Surprise shelf")}</b>
      <div class="bonus-row" style="margin-top:8px">${bonus}</div>
    </div>
    <button class="big-btn sky squishy" data-action="open-treasury">
      💛 ${t("Skarbczyk słówek", "Word Treasury")} (${state.words.length})</button>
    <div class="card"><div class="badge-row">${badges}</div></div>`;
}

/* ---------------- reading ---------------- */
function renderRead() {
  const ch = chapterData(ui.chapter);
  const c = content();
  const kicker = isBonus(ui.chapter)
    ? ch.kind
    : `${t("Rozdział", "Chapter")} ${ui.chapter + 1} ${t("z", "of")} ${c.chapters.length}`;
  let html = "";
  const paras = ch.text.split("\n\n");
  const seen = new Set();
  for (const para of paras) {
    let p = esc(para);
    for (const v of ch.vocab || []) {
      if (seen.has(v.w)) continue;
      const escaped = esc(v.w);
      if (p.includes(escaped)) {
        const known = state.words.some((k) => k === wordKey(v));
        p = p.replace(escaped,
          `<button class="vocab ${known ? "known" : ""}" data-action="word" data-w="${esc(v.w)}">${escaped}</button>`);
        seen.add(v.w);
      }
    }
    html += `<p>${p}</p>`;
  }
  return `
    <div class="topbar">
      <button class="back-btn squishy" data-action="go-map">←</button>
      <span class="size-ctrl">
        <button class="squishy" data-action="size" data-d="-1">A−</button>
        <button class="squishy" data-action="size" data-d="1">A+</button>
      </span>
      <span class="pill"><span class="pts">🏅 ${state.points}</span></span>
    </div>
    <div class="read-card">
      <div class="read-kicker">${esc(kicker)}</div>
      <h2 class="read-title">${esc(ch.title)}</h2>
      <div class="read-text ${ch.poem ? "poem" : ""}" style="--read-size:${state.readSize}px; font-size:${state.readSize}px">${html}</div>
    </div>
    <p class="small-note">💡 ${t("Dotknij podkreślonych słówek, aby poznać ich znaczenie!",
      "Tap the underlined words to learn what they mean!")}</p>
    <button class="big-btn mint squishy" data-action="start-quiz" id="start-quiz">
      ${t("Pytania! →", "Questions! →")}</button>`;
}

/* ---------------- word popup ---------------- */
function wordKey(v) { return (v.base || v.w).toLowerCase(); }
function findWord(w) {
  const ch = chapterData(ui.chapter);
  return (ch.vocab || []).find((v) => v.w === w);
}
function renderWordPop() {
  const v = ui.wordPop;
  return `
    <div class="overlay-backdrop" data-action="close-pop">
      <div class="sheet word-pop" data-action="noop">
        <div class="w">${esc(v.base || v.w)}</div>
        ${v.tr ? `<div class="tr">= ${esc(v.tr)}</div>` : ""}
        <div class="d">${esc(v.def)}</div>
        <div class="ex">„${esc(v.ex)}”</div>
        <button class="big-btn squishy" data-action="close-pop" style="min-height:54px;font-size:19px">
          ${t("Super, rozumiem!", "Got it!")}</button>

/* ---------------- quiz ---------------- */
const PRAISES_PL = ["Brawo, Tosiu!", "Świetnie, Tosiu!", "Rewelacja!", "Dokładnie tak!", "Kapitalnie!", "Jesteś uważną czytelniczką!"];
const PRAISES_EN = ["Great job, Tosia!", "Exactly right!", "Wonderful!", "You read so carefully!", "Brilliant!", "Super!"];
function praise() {
  const pool = ui.mode === "en" ? PRAISES_EN : PRAISES_PL;
  return pool[(Math.random() * pool.length) | 0];
}
function tagName(k) {
  const map = {
    fact: t("Szukaj w tekście", "Find in the text"), seq: t("Kolejność zdarzeń", "Order of events"),
    feel: t("Uczucia bohaterów", "Feelings"), cause: t("Przyczyna i skutek", "Cause and effect"),
    main: t("Główna myśl", "Main idea"), infer: t("Pomyśl!", "Think!"), moral: t("Nauka z rozdziału", "The lesson"),
    who: t("Kto to?", "Who is it?"),
  };
  return map[k] || "";
}
function startQuiz() {
  const ch = chapterData(ui.chapter);
  ui.quiz = { qs: ch.questions, i: 0, firstTry: true, correctFirst: 0, hint: null, order: [], praise: null, wrongIdx: [] };
  ui.screen = "quiz";
  render();
}
function renderQuiz() {
  const qz = ui.quiz;
  const q = qz.qs[qz.i];
  const prog = qz.qs.map((_, i) =>
    `<i class="${i < qz.i ? "done" : (i === qz.i ? "now" : "")}"></i>`).join("");
  let body = "";
  if (q.t === "mc" || q.t === "tf") {
    const opts = q.t === "tf" ? [t("Prawda", "True"), t("Fałsz", "False")] : q.opts;
    body = opts.map((o, i) =>
      `<button class="opt squishy ${qz.wrongIdx.includes(i) ? "bad" : ""}" data-action="answer" data-i="${i}"
        ${qz.wrongIdx.includes(i) ? "disabled" : ""}>${esc(o)}</button>`).join("");
  } else if (q.t === "order") {
    const placed = qz.order.map((i) => `<span class="chip-done">${esc(q.items[i])}</span>`).join("");
    const remaining = q.items.map((item, i) =>
      qz.order.includes(i) ? "" :
      `<button class="opt squishy" data-action="order-pick" data-i="${i}">${esc(item)}</button>`).join("");
    body = `<div class="order-strip">${placed || `<span class="small-note" style="margin:4px auto">${t("Ułóż po kolei ⬇", "Put in order ⬇")}</span>`}</div>${remaining}`;
  }
  return `
    <div class="topbar">
      <button class="back-btn squishy" data-action="back-to-read">←</button>
      <span class="pill"><span class="pts">🏅 ${state.points}</span></span>
    </div>
    <div class="q-prog">${prog}</div>
    <div class="card">
      <span class="q-tag">${tagName(q.k)}</span>
      <div class="q-text">${esc(q.q)}</div>
      ${qz.praise ? `<div class="praise-line" id="praise">${esc(qz.praise)}</div>` : ""}
      ${qz.hint ? `<div class="hint-bubble" id="hint">💡 ${esc(qz.hint)}</div>` : ""}
      ${body}
    </div>`;
}
function answerResult(correct, q) {
  const qz = ui.quiz;
  if (correct) {
    sfx.good();
    confetti.burst(14);
    const pts = qz.firstTry ? 10 : 5;
    state.points += pts;
    if (qz.firstTry) qz.correctFirst++;
    qz.praise = praise() + ` +${pts}`;
    qz.hint = null;
    saveState();
    render();
    setTimeout(nextQuestion, 950);
  } else {
    sfx.soft();
    qz.firstTry = false;
    qz.hint = q.hint;
    qz.praise = null;
    render();
  }
}
function nextQuestion() {
  const qz = ui.quiz;
  if (!qz) return;
  qz.i++;
  qz.firstTry = true;
  qz.hint = null;
  qz.praise = null;
  qz.order = [];
  qz.wrongIdx = [];
  if (qz.i >= qz.qs.length) return finishChapter();
  render();
}
function finishChapter() {
  const qz = ui.quiz;
  const key = chapterKey(ui.chapter);
  const total = qz.qs.length;
  const ratio = qz.correctFirst / total;
  const stars = ratio >= 0.999 ? 3 : ratio >= 0.66 ? 2 : 1;
  const firstTime = !state.done.includes(key);
  if (firstTime) state.done.push(key);
  state.stars[key] = Math.max(state.stars[key] || 0, stars);
  if (stars === 3 && !state.perfect.includes(key)) state.perfect.push(key);
  const bonusPts = stars === 3 ? 15 : 0;
  state.points += bonusPts;
  saveState();
  ui.celebration = { stars, correctFirst: qz.correctFirst, total, bonusPts, key };
  ui.quiz = null;
  ui.screen = "read";
  sfx.fanfare();
  confetti.burst(stars === 3 ? 110 : 70);
  checkBadges();
  render();
}
function renderCelebration() {
  const cel = ui.celebration;

  const nextIdx = isStory ? ui.chapter + 1 : null;
  const hasNext = isStory && nextIdx < content().chapters.length;
  return `
    <div class="overlay-backdrop">
      <div class="sheet celebrate" data-action="noop">
        <div class="big">${cel.stars === 3 ? "🏆" : "🎉"}</div>

          ? t("Perfekcyjnie, Tosiu!", "Perfect, Tosia!")
          : t("Rozdział ukończony!", "Chapter complete!")}</h1>
        <div class="stars-big">${starsHtml(cel.stars)}</div>

          <b>${cel.correctFirst}/${cel.total}</b>${cel.bonusPts ? ` · +${cel.bonusPts} ${t("pkt bonusu!", "bonus pts!")}` : ""}</p>
        ${hasNext ? `<button class="big-btn squishy" data-action="next-chapter">

          ${t("Mapa opowieści", "Story map")}</button>

}

/* ---------------- treasury ---------------- */
function allVocab() {
  const c = content();
  const all = [];
  for (const ch of c.chapters.concat(c.bonus)) for (const v of ch.vocab || []) all.push(v);
  return all;
}
function collectedVocab() {
  const all = allVocab();
  return state.words.map((k) => all.find((v) => wordKey(v) === k)).filter(Boolean);
}
function renderTreasury() {
  const words = collectedVocab();
  const cards = words.map((v) => `
    <div class="word-card"><div class="w">${esc(v.base || v.w)}</div>
    <div class="d">${v.tr ? esc(v.tr) + " · " : ""}${esc(v.def)}</div></div>`).join("");
  return `
    <div class="topbar">
      <button class="back-btn squishy" data-action="go-map">←</button>
      <span class="pill"><span class="pts">🏅 ${state.points}</span></span>
    </div>
    <h1 style="font-size:26px">💛 ${t("Skarbczyk słówek", "Word Treasury")}</h1>
    <p class="subtitle">${words.length
      ? t(`Masz już ${words.length} słówek!`, `You have ${words.length} words!`)
      : t("Dotykaj podkreślonych słówek w opowieści, a trafią tutaj!",
          "Tap underlined words in the story and they will land here!")}</p>
    ${words.length >= 4 ? `<button class="big-btn squishy" data-action="word-quiz">
      🎯 ${t("Zagadka słówkowa!", "Word quiz!")}</button>` : ""}
    <div class="word-grid">${cards}</div>`;
}
function startWordQuiz() {
  const words = collectedVocab();
  const shuffled = words.slice().sort(() => Math.random() - 0.5).slice(0, 5);
  ui.wordQuiz = { rounds: shuffled, i: 0, score: 0, wrongIdx: [], praise: null };
  buildWordRound();
  render();
}
function buildWordRound() {
  const wq = ui.wordQuiz;
  const v = wq.rounds[wq.i];
  const others = collectedVocab().filter((o) => wordKey(o) !== wordKey(v)).sort(() => Math.random() - 0.5).slice(0, 3);
  const opts = others.concat([v]).sort(() => Math.random() - 0.5);
  wq.current = { v, opts, answer: opts.indexOf(v) };
  wq.wrongIdx = [];
}
function renderWordQuiz() {
  const wq = ui.wordQuiz;
  if (wq.i >= wq.rounds.length) {
    return `
      <div class="overlay-backdrop">
        <div class="sheet celebrate" data-action="noop">
          <div class="big">${wq.score === wq.rounds.length ? "💎" : "🎉"}</div>
          <h1 style="font-size:26px">${t("Zagadka rozwiązana!", "Quiz complete!")}</h1>
          <p class="subtitle">${wq.score}/${wq.rounds.length} · +${wq.score * 3} ${t("pkt", "pts")}</p>
          <button class="big-btn mint squishy" data-action="close-word-quiz">${t("Super!", "Great!")}</button>
        </div>
      </div>`;
  }
  const { v, opts } = wq.current;
  const label = ui.mode === "en" ? `What does “${v.base || v.w}” mean?` : `Co znaczy słowo „${v.base || v.w}”?`;
  return `
    <div class="overlay-backdrop">
      <div class="sheet" data-action="noop">
        <div class="q-prog">${wq.rounds.map((_, i) =>
          `<i class="${i < wq.i ? "done" : i === wq.i ? "now" : ""}"></i>`).join("")}</div>
        <div class="q-text">${esc(label)}</div>
        ${wq.praise ? `<div class="praise-line">${esc(wq.praise)}</div>` : ""}
        ${opts.map((o, i) => `<button class="opt squishy ${wq.wrongIdx.includes(i) ? "bad" : ""}"
          data-action="word-quiz-answer" data-i="${i}" ${wq.wrongIdx.includes(i) ? "disabled" : ""}>
          ${esc(ui.mode === "en" ? (o.tr || o.def) : o.def)}</button>`).join("")}
        <button class="linklike small-note squishy" data-action="close-word-quiz" style="display:block;margin:10px auto 0">
          ${t("Zamknij", "Close")}</button>
      </div>
    </div>`;
}

/* ============================ actions ============================ */
const actions = {
  noop() {},
  "pick-mode"(el) {
    ui.mode = el.dataset.mode;
    state = loadState(ui.mode);
    ui.screen = "map";
    render();
  },
  "go-home"() { saveState(); ui.mode = null; ui.screen = "home"; render(); },
  "go-map"() { ui.screen = "map"; ui.quiz = null; render(); },
  "open-chapter"(el) {
    const raw = el.dataset.ch;
    ui.chapter = raw.startsWith("b") ? raw : parseInt(raw, 10);
    ui.screen = "read";
    render();
  },
  size(el) {
    state.readSize = Math.min(26, Math.max(16, state.readSize + 2 * parseInt(el.dataset.d, 10)));
    saveState(); render();
  },
  word(el) {
    const v = findWord(el.dataset.w);
    if (!v) return;
    sfx.word();
    const key = wordKey(v);
    if (!state.words.includes(key)) {
      state.words.push(key);
      state.points += 2;
      saveState();
      showToast(`💛 ${t("Nowe słówko w skarbczyku! +2", "New word in your Treasury! +2")}`);
      checkBadges();
    }
    ui.wordPop = v;
    render();
  },
  "close-pop"() { ui.wordPop = null; render(); },
  "start-quiz"() { startQuiz(); },
  "back-to-read"() { ui.screen = "read"; ui.quiz = null; render(); },
  answer(el) {
    const qz = ui.quiz; if (!qz) return;
    const q = qz.qs[qz.i];
    const i = parseInt(el.dataset.i, 10);
    const correct = q.t === "tf" ? (i === 0) === q.a : i === q.a;
    if (!correct) qz.wrongIdx.push(i);
    answerResult(correct, q);
  },
  "order-pick"(el) {
    const qz = ui.quiz; if (!qz) return;
    const q = qz.qs[qz.i];
    const i = parseInt(el.dataset.i, 10);
    if (i === qz.order.length) {           // items are stored in correct order
      qz.order.push(i);
      sfx.good();
      if (qz.order.length === q.items.length) {
        const pts = qz.firstTry ? 10 : 5;
        state.points += pts;
        if (qz.firstTry) qz.correctFirst++;
        qz.praise = praise() + ` +${pts}`;
        saveState(); render();
        setTimeout(nextQuestion, 950);
      } else render();
    } else {
      sfx.soft();
      qz.firstTry = false;
      qz.order = [];
      qz.hint = q.hint;
      render();
    }
  },
  "next-chapter"() {
    ui.celebration = null;
    ui.chapter = isBonus(ui.chapter) ? ui.chapter : ui.chapter + 1;
    ui.screen = "read";
    render();
  },
  "back-map-cel"() { ui.celebration = null; ui.screen = "map"; render(); },
  "open-treasury"() { ui.screen = "treasury"; render(); },
  "word-quiz"() { startWordQuiz(); },
  "word-quiz-answer"(el) {
    const wq = ui.wordQuiz; if (!wq) return;
    const i = parseInt(el.dataset.i, 10);
    if (i === wq.current.answer) {
      sfx.good(); confetti.burst(10);
      wq.score++; state.points += 3; saveState();
      wq.praise = praise();
      wq.i++;
      if (wq.i < wq.rounds.length) buildWordRound();
      render();
    } else {
      sfx.soft(); wq.wrongIdx.push(i); render();
    }
  },
  "close-word-quiz"() { ui.wordQuiz = null; render(); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.classList.contains("overlay-backdrop") && e.target !== el) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el);
});

/* ---------- decor + validation + boot ---------- */
function decorate() {
  const glyphs = ["📖", "✨", "⭐", "💜", "🫧", "🌸", "🦋", "💫"];
  $("#decor").innerHTML = glyphs.concat(glyphs).map((g, i) => {
    const left = (i * 53 + 11) % 96, top = (i * 37 + 7) % 92;
    return `<span style="left:${left}%;top:${top}%;font-size:${13 + (i * 7) % 16}px;animation-delay:-${(i * 1.37) % 9}s,-${(i * 2.3) % 17}s">${g}</span>`;
  }).join("");
}

/** Content self-check used by the automated tests. */
window.__validateContent = function () {
  const issues = [];
  for (const [name, data] of [["PL", DATA_PL], ["EN", DATA_EN]]) {
    if (data.chapters.length < 12) issues.push(`${name}: only ${data.chapters.length} chapters`);
    for (const [ci, ch] of data.chapters.concat(data.bonus).entries()) {
      const label = `${name} "${ch.title}"`;
      if (!ch.text || ch.text.length < 80) issues.push(`${label}: text too short`);
      for (const v of ch.vocab || []) {
        if (!ch.text.includes(v.w)) issues.push(`${label}: vocab "${v.w}" not found in text`);
        if (!v.def || !v.ex) issues.push(`${label}: vocab "${v.w}" missing def/example`);
      }
      for (const [qi, q] of (ch.questions || []).entries()) {
        const ql = `${label} q${qi + 1}`;
        if (q.t === "mc" && (!Array.isArray(q.opts) || q.a == null || !q.opts[q.a])) issues.push(`${ql}: bad mc`);
        if (q.t === "tf" && typeof q.a !== "boolean") issues.push(`${ql}: bad tf`);
        if (q.t === "order" && (!Array.isArray(q.items) || q.items.length < 3)) issues.push(`${ql}: bad order`);
        if (!q.hint) issues.push(`${ql}: missing hint`);
        if (!q.k) issues.push(`${ql}: missing skill tag`);
      }
      if (!isNaN(ci) && ci < data.chapters.length && (ch.questions || []).length < 4) {
        issues.push(`${label}: fewer than 4 questions`);
      }
    }
  }
  return issues;
};
