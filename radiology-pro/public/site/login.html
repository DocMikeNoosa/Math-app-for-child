<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Zaloguj się — RadVox Pro</title>
  <link rel="icon" type="image/png" href="/icons/radvox-192.png" />
  <link rel="stylesheet" href="/site/site.css" />
</head>
<body data-page="login">
  <main class="auth">
    <div class="auth-card">
      <a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span><span data-brand>RadVox Pro</span></a>
      <div class="card">
        <h1>Zaloguj się</h1>
        <p class="sub">Dyktowanie opisów radiologicznych z AI</p>
        <div id="msg" class="msg" hidden></div>
        <form id="form" novalidate>
          <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required autofocus /></div>
          <div class="field"><label for="password">Hasło</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
          <button class="btn btn-primary btn-lg" type="submit">Zaloguj</button>
          <p class="auth-foot"><a href="/forgot">Nie pamiętasz hasła?</a></p>
        </form>
        <form id="form2fa" novalidate hidden>
          <p class="sub">Logowanie dwuetapowe: wpisz 6-cyfrowy kod z aplikacji uwierzytelniającej w telefonie.</p>
          <div class="field"><label for="code">Kod</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*" required /></div>
          <button class="btn btn-primary btn-lg" type="submit">Potwierdź</button>
        </form>
      </div>
      <p class="auth-foot">Nie masz konta? <a href="/register">Załóż bezpłatne konto próbne</a></p>
    </div>
  </main>
  <script type="module" src="/site/auth.js"></script>
</body>
</html>
