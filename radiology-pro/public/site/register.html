<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Załóż konto — RadVox Pro</title>
  <link rel="icon" type="image/png" href="/icons/radvox-192.png" />
  <link rel="stylesheet" href="/site/site.css" />
</head>
<body data-page="register">
  <main class="auth">
    <div class="auth-card">
      <a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span><span data-brand>RadVox Pro</span></a>
      <div class="card">
        <h1>Załóż konto</h1>
        <p class="sub"><span id="trialDays">14</span> dni za darmo, bez karty płatniczej</p>
        <div id="msg" class="msg" hidden></div>
        <form id="form" novalidate>
          <div class="field"><label for="name">Imię i nazwisko</label><input id="name" name="name" autocomplete="name" required autofocus /></div>
          <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required /></div>
          <div class="field"><label for="phone">Telefon <span class="faint">(opcjonalnie)</span></label><input id="phone" name="phone" type="tel" autocomplete="tel" /></div>
          <div class="field"><label for="password">Hasło <span class="faint">(min. 10 znaków, litera i cyfra)</span></label><input id="password" name="password" type="password" autocomplete="new-password" required /></div>
          <div class="field"><label for="password2">Powtórz hasło</label><input id="password2" name="password2" type="password" autocomplete="new-password" required /></div>
          <div class="field"><label class="check"><input type="checkbox" name="accept" /> <span>Akceptuję <a href="/terms" target="_blank">regulamin</a> i <a href="/privacy" target="_blank">politykę prywatności</a>. Jestem lekarzem. Rozumiem, że AI przygotowuje projekt opisu: przed użyciem przeczytam cały opis i sprawdzę go własną oceną kliniczną; korzystam z aplikacji na własną odpowiedzialność.</span></label></div>
          <div class="field"><label class="check"><input type="checkbox" name="marketing" /> <span>Chcę dostawać e-mailem informacje o ofercie i rabatach RadVox Pro (możesz to odwołać w każdej chwili).</span></label></div>
          <button class="btn btn-primary btn-lg" type="submit">Załóż konto i zacznij</button>
        </form>
      </div>
      <p class="auth-foot">Masz już konto? <a href="/login">Zaloguj się</a></p>
    </div>
  </main>
  <script type="module" src="/site/auth.js"></script>
</body>
</html>
