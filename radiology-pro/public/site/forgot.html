<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Nowe hasło — Radiopis</title>
  <link rel="icon" type="image/png" href="/icons/radvox-192.png" />
  <link rel="stylesheet" href="/site/site.css" />
</head>
<body data-page="forgot">
  <main class="auth">
    <div class="auth-card">
      <a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span><span data-brand>Radiopis</span></a>
      <div class="card">
        <h1>Nowe hasło</h1>
        <p class="sub">Wyślemy link do ustawienia nowego hasła</p>
        <div id="msg" class="msg" hidden></div>
        <form id="form" novalidate>
          <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required autofocus /></div>
          <button class="btn btn-primary btn-lg" type="submit">Wyślij link</button>
        </form>
      </div>
      <p class="auth-foot"><a href="/login">Wróć do logowania</a></p>
    </div>
  </main>
  <script type="module" src="/site/auth.js"></script>
</body>
</html>
